<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (function () {
            var media = window.matchMedia('(prefers-color-scheme: dark)');
            function applyDark() {
                var theme = null;
                try { theme = localStorage.getItem('theme'); } catch (e) { }
                var dark = theme === 'dark' || (theme !== 'light' && media.matches);
                document.documentElement.classList.toggle('dark', dark);
                document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
            }
            window.saThemeInit = function () {
                window.saLoadThemeFonts('default');
            };
            applyDark();
            window.addEventListener('storage', function (e) {
                if (e.key === null || e.key === 'theme') applyDark();
            });
            media.addEventListener('change', applyDark);
        })();
    </script>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <script>window.saThemeFonts = {"default":"Inter:wght@400..700","ledger":"Lexend:wght@300..700","ops":"IBM\u002BPlex\u002BSans:wght@400;500;600;700","soft":"Figtree:wght@400..700"};</script>
    <script src="/demo/ui/assets/theme-fonts.qm7amh8j3s.js"></script>
    <link rel="stylesheet" href="/demo/ui/assets/site.zob7bbxt44.css" />
    <link rel="stylesheet" href="/demo/ui/assets/stellar-admin.mjr7w04qmf.css" />
        <script>saThemeInit();</script>
    
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s;
        }
    </style>
    

    <script defer src="/demo/ui/assets/stellar-admin.8p6ma0vskj.js"></script>
</head>
<body>
<script>
    window.addEventListener('load', function () {
        document.body.style.opacity = '1';
    });
</script>
<div class="preview flex w-full justify-center px-10 py-10">
    
    <div class="py-2">
    <!-- code begin -->
    <div class="sa-stack sa-stack-align-stretch sa-stack-gap-sm sa-stack-justify-start">
        <button interestfor="--tooltip-js-events" aria-label="Show tooltip" data-slot="button" class="sa-button sa-button-variant-outline sa-button-size-icon-sm">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5c0 1.1.9 2 2 2h1"></path><path d="M16 21h1a2 2 0 0 0 2-2v-5c0-1.1.9-2 2-2a2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1"></path></svg>
        </button>
        <label class="text-sm font-bold">Events:</label>
        <div class="font-mono w-100 h-40 overflow-y-auto rounded-lg border border-border bg-muted p-3 text-foreground" id="--tooltip-js-events-output">
        </div>
    </div>
    <div id="--tooltip-js-events" popover="hint" data-slot="tooltip-content" data-anchor-side="top" class="sa-tooltip-content anchored-top-center">
        This tooltip emits JS events when it opens and closes
    </div>
    <script>
        let counter = 0;
        const eventsTooltip = document.getElementById('--tooltip-js-events');
        const eventsTooltipEventOutput = document.getElementById('--tooltip-js-events-output');

        eventsTooltip.addEventListener("interest", (e) => {
            eventsTooltipEventOutput.innerText = `${++counter}: Tooltip opened\n` + eventsTooltipEventOutput.innerText;
        });
        eventsTooltip.addEventListener("loseinterest", (e) => {
            eventsTooltipEventOutput.innerText = `${++counter}: Tooltip closed\n` + eventsTooltipEventOutput.innerText;
        });
    </script>
    <!-- code end -->
</div>


</div>



</body>
</html>
