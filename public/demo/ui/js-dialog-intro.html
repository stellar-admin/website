<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (function () {
            var media = window.matchMedia('(prefers-color-scheme: dark)');
            function applyDark() {
                var theme = null;
                try { theme = localStorage.getItem('theme'); } catch (e) { }
                var dark = theme === 'dark' || (theme !== 'light' && media.matches);
                document.documentElement.classList.toggle('dark', dark);
                document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
            }
            window.saThemeInit = function () {
                window.saLoadThemeFonts('default');
            };
            applyDark();
            window.addEventListener('storage', function (e) {
                if (e.key === null || e.key === 'theme') applyDark();
            });
            media.addEventListener('change', applyDark);
        })();
    </script>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <script>window.saThemeFonts = {"default":"Inter:wght@400..700","ledger":"Lexend:wght@300..700","ops":"IBM\u002BPlex\u002BSans:wght@400;500;600;700","soft":"Figtree:wght@400..700"};</script>
    <script src="/demo/ui/assets/theme-fonts.qm7amh8j3s.js"></script>
    <link rel="stylesheet" href="/demo/ui/assets/site.lhm5lmseqz.css" />
    <link rel="stylesheet" href="/demo/ui/assets/stellar-admin.w7n1qyns01.css" />
        <script>saThemeInit();</script>
    
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s;
        }
    </style>
    

    <script type="module" src="/demo/ui/assets/stellar-admin.3f1a4wn8fi.js"></script>
</head>
<body>
<script>
    window.addEventListener('load', function () {
        document.body.style.opacity = '1';
    });
</script>
<div class="preview flex w-full justify-center px-10 py-10">
    
    <!--strip
asp-antiforgery="false"
-->
<div class="min-h-[450px]">
    <!-- code begin -->
    <div class="sa-stack sa-stack-align-start sa-stack-gap-md sa-stack-justify-start min-w-md">
        <button id="--js-dialog-intro-button" data-slot="button" class="sa-button sa-button-variant-outline sa-button-size-default">
            Open Dialog
        </button>
        <label class="text-sm font-bold">Result:</label>
        <div class="font-mono w-full h-40 overflow-y-auto rounded-lg border border-border bg-muted p-3 text-foreground" id="--js-dialog-intro-result">-</div>
    </div>
    <sel-dialog><dialog id="--js-dialog-intro-dialog" data-slot="dialog-content" class="sa-dialog-content">
        <div data-slot="dialog-header" class="sa-dialog-header">
            <h2 data-slot="dialog-title" class="sa-dialog-title">Are you absolutely sure?</h2>
            <p data-slot="dialog-description" class="sa-dialog-description">
                This action cannot be undone. This will permanently delete your account from our servers.
            </p>
        </div>
        <form method="dialog" action="/DocsStatic/?name=Js/Dialog/_Intro&amp;layout=">
            <div data-slot="dialog-footer" class="sa-dialog-footer">
                <button type="submit" value="cancel" data-slot="button" class="sa-button sa-button-variant-outline sa-button-size-default">
                    Cancel
                </button>
                <button type="submit" value="confirm" autofocus data-slot="button" class="sa-button sa-button-variant-default sa-button-size-default">
                    Continue
                </button>
            </div>
        </form>
    </dialog></sel-dialog>
    <script type="module">
        (function () {
            const dialog = window.stellarAdmin.dialog(document.getElementById("--js-dialog-intro-dialog"));
            const triggerButton = document.getElementById("--js-dialog-intro-button");
            const resultDisplay = document.getElementById("--js-dialog-intro-result");

            triggerButton.addEventListener("click", async (event) => {
                const result = await dialog.showAsync();
                resultDisplay.innerHTML = JSON.stringify(result, null, 4);
            });
        })();
    </script>
    <!-- code end -->
</div>

</div>



</body>
</html>
