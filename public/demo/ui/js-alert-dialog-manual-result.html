<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (function () {
            var media = window.matchMedia('(prefers-color-scheme: dark)');
            function applyDark() {
                var theme = null;
                try { theme = localStorage.getItem('theme'); } catch (e) { }
                var dark = theme === 'dark' || (theme !== 'light' && media.matches);
                document.documentElement.classList.toggle('dark', dark);
                document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
            }
            window.saThemeInit = function () {
                window.saLoadThemeFonts('default');
            };
            applyDark();
            window.addEventListener('storage', function (e) {
                if (e.key === null || e.key === 'theme') applyDark();
            });
            media.addEventListener('change', applyDark);
        })();
    </script>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <script>window.saThemeFonts = {"default":"Inter:wght@400..700","ledger":"Lexend:wght@300..700","ops":"IBM\u002BPlex\u002BSans:wght@400;500;600;700","soft":"Figtree:wght@400..700"};</script>
    <script src="/demo/ui/assets/theme-fonts.qm7amh8j3s.js"></script>
    <link rel="stylesheet" href="/demo/ui/assets/site.lhm5lmseqz.css" />
    <link rel="stylesheet" href="/demo/ui/assets/stellar-admin.e7nac9dd0h.css" />
        <script>saThemeInit();</script>
    
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s;
        }
    </style>
    

    <script type="module" src="/demo/ui/assets/stellar-admin.dvwe7gkgmv.js"></script>
</head>
<body>
<script>
    window.addEventListener('load', function () {
        document.body.style.opacity = '1';
    });
</script>
<div class="preview flex w-full justify-center px-10 py-10">
    
    <div class="min-h-[450px]">
    <!-- code begin -->
    <div class="sa-stack sa-stack-align-start sa-stack-gap-md sa-stack-justify-start min-w-md">
        <button id="--js-alert-dialog-manual-button" data-slot="button" class="sa-button sa-button-variant-outline sa-button-size-default">
            Open Alert Dialog
        </button>
        <label class="text-sm font-bold">Result:</label>
        <div class="font-mono w-full rounded-md border border-border bg-muted p-3 text-foreground" id="--js-alert-dialog-manual-result">-</div>
    </div>
    <sel-dialog><dialog id="--js-alert-dialog-manual-dialog" data-slot="alert-dialog-content" data-size="default" closedby="closerequest" class="sa-alert-dialog-content">
        <div data-slot="alert-dialog-header" class="sa-alert-dialog-header">
            <h2 data-slot="alert-dialog-title" class="sa-alert-dialog-title">Manual Result</h2>
            <p data-slot="alert-dialog-description" class="sa-alert-dialog-description">
                Demonstrates how you can manually resolve the confirmation.
            </p>
        </div>
        <div data-slot="alert-dialog-footer" class="sa-alert-dialog-footer">
            <button id="--js-alert-dialog-manual-button-cancel" data-slot="button" class="sa-button sa-button-variant-outline sa-button-size-default">
                Cancel
            </button>
            <button id="--js-alert-dialog-manual-button-confirm" autofocus data-slot="button" class="sa-button sa-button-variant-default sa-button-size-default">
                Confirm
            </button>
        </div>
    </dialog></sel-dialog>
    <script type="module">
        (function () {
            const alertDialog = window.stellarAdmin.alertDialog(document.getElementById("--js-alert-dialog-manual-dialog"));
            const resultDisplay = document.getElementById("--js-alert-dialog-manual-result");
            const triggerButton = document.getElementById("--js-alert-dialog-manual-button");
            const cancelButton = document.getElementById("--js-alert-dialog-manual-button-cancel");
            const confirmButton = document.getElementById("--js-alert-dialog-manual-button-confirm");

            triggerButton.addEventListener("click", async () => {
                const confirmed = await alertDialog.confirmAsync();
                resultDisplay.innerHTML = confirmed ? "Confirmed" : "Cancelled";
            });
            cancelButton.addEventListener("click", () => {
                alertDialog.cancel();
            });
            confirmButton.addEventListener("click", () => {
                alertDialog.confirm();
            });
        })();
    </script>
    <!-- code end -->
</div>


</div>



</body>
</html>
