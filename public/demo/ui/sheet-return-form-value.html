<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (function () {
            var media = window.matchMedia('(prefers-color-scheme: dark)');
            function applyDark() {
                var theme = null;
                try { theme = localStorage.getItem('theme'); } catch (e) { }
                var dark = theme === 'dark' || (theme !== 'light' && media.matches);
                document.documentElement.classList.toggle('dark', dark);
                document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
            }
            window.saThemeInit = function () {
                window.saLoadThemeFonts('default');
            };
            applyDark();
            window.addEventListener('storage', function (e) {
                if (e.key === null || e.key === 'theme') applyDark();
            });
            media.addEventListener('change', applyDark);
        })();
    </script>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <script>window.saThemeFonts = {"default":"Inter:wght@400..700","ledger":"Lexend:wght@300..700","ops":"IBM\u002BPlex\u002BSans:wght@400;500;600;700","soft":"Figtree:wght@400..700"};</script>

        <script>saThemeInit();</script>

<script>

</script>
<div class="preview flex w-full justify-center px-10 py-10">

<div class="min-h-[450px]">
    <!-- code begin -->
    <div class="sa-stack sa-stack-align-start sa-stack-gap-md sa-stack-justify-start min-w-md">
        <button commandfor="--sheet-return-form-value-sheet" command="show-modal" data-slot="button" class="sa-button sa-button-variant-outline sa-button-size-default">
            Open Sheet with Form
        </button>
        <label class="text-sm font-bold">Output:</label>
        <div class="font-mono w-full h-40 overflow-y-auto rounded-lg border border-border bg-muted p-3 text-foreground" id="--sheet-return-form-value-output">-</div>
    </div>
    <sel-dialog><dialog id="--sheet-return-form-value-sheet" data-slot="sheet-content" data-side="right" class="sa-sheet-content"><button type="button" class="sa-button sa-button-variant-ghost sa-button-size-icon-sm sa-sheet-close" commandfor="--sheet-return-form-value-sheet" command="close" data-slot="button"><svg class="size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg><span class="sr-only">Close</span></button><div class="sa-sheet-body">
        <form method="dialog" class="flex flex-col h-full gap-4" action="/DocsStatic/?name=Sheet/_ReturnFormValue&amp;layout=">
            <div data-slot="sheet-header" class="sa-sheet-header">
                <h2 data-slot="sheet-title" class="sa-sheet-title">Edit traveller</h2>
                <p data-slot="sheet-description" class="sa-sheet-description">Update the traveller's details here. Click save when you're done.
                </p>
            </div>
            <div class="sa-field-group grid gap-6 px-4" data-slot="field-group">
                <div class="sa-field sa-field-orientation-vertical" data-orientation="vertical" data-slot="field">
                    <label for="--sheet-return-form-value-name" data-slot="label" class="sa-label">Name</label>
                    <input id="--sheet-return-form-value-name" name="name" value="Ibn Battuta" required data-slot="input" class="sa-input">
                </div>
                <div class="sa-field sa-field-orientation-vertical" data-orientation="vertical" data-slot="field">
                    <label for="--sheet-return-form-value-username" data-slot="label" class="sa-label">Username</label>
                    <input id="--sheet-return-form-value-username" name="username" value="@ibnbattuta" required data-slot="input" class="sa-input">
                </div>
            </div>
            <div data-slot="sheet-footer" class="sa-sheet-footer">
                <button type="button" commandfor="--sheet-return-form-value-sheet" command="close" data-slot="button" class="sa-button sa-button-variant-outline sa-button-size-default">
                    Cancel
                </button>
                <button type="submit" value="confirm" data-slot="button" class="sa-button sa-button-variant-default sa-button-size-default">
                    Save Changes
                </button>
            </div>
        </form>
    </div></dialog></sel-dialog>
    <script>
        (function() {
            const sheet = document.getElementById("--sheet-return-form-value-sheet");
            const output = document.getElementById("--sheet-return-form-value-output");

            sheet.addEventListener("close", () => {
                const cancelled = sheet.returnValue === "" || sheet.returnValue === "cancel";
                if (cancelled) {
                    output.innerHTML = "Cancelled";
                    return;
                }

                const form = sheet.querySelector("form");
                const data = Object.fromEntries(new FormData(form));
                output.innerHTML = JSON.stringify(data, null, 2);
            });
            sheet.addEventListener("toggle", (e) => {
                // Reset the return value every time the dialog opens to prevent a previous
                // returnValue from being returned when pressing the Esc key
                if (e.newState === "open") {
                    sheet.returnValue = "";
                }
            });
        })();
    </script>
    <!-- code end -->
