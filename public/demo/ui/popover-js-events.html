<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (function () {
            var media = window.matchMedia('(prefers-color-scheme: dark)');
            function applyDark() {
                var theme = null;
                try { theme = localStorage.getItem('theme'); } catch (e) { }
                var dark = theme === 'dark' || (theme !== 'light' && media.matches);
                document.documentElement.classList.toggle('dark', dark);
                document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
            }
            window.saThemeInit = function () {
                window.saLoadThemeFonts('default');
            };
            applyDark();
            window.addEventListener('storage', function (e) {
                if (e.key === null || e.key === 'theme') applyDark();
            });
            media.addEventListener('change', applyDark);
        })();
    </script>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <script>window.saThemeFonts = {"default":"Inter:wght@400..700","ledger":"Lexend:wght@300..700","ops":"IBM\u002BPlex\u002BSans:wght@400;500;600;700","soft":"Figtree:wght@400..700"};</script>
    <script src="/demo/ui/assets/theme-fonts.qm7amh8j3s.js"></script>
    <link rel="stylesheet" href="/demo/ui/assets/site.ik9cnslwdi.css" />
    <link rel="stylesheet" href="/demo/ui/assets/stellar-admin.5r46fh0qez.css" />
        <script>saThemeInit();</script>
    
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s;
        }
    </style>
    

    <script defer src="/demo/ui/assets/stellar-admin.75o4aety6w.js"></script>
</head>
<body>
<script>
    window.addEventListener('load', function () {
        document.body.style.opacity = '1';
    });
</script>
<div class="preview flex w-full justify-center px-10 py-10">
    
    <!-- code begin -->
<div class="sa-stack sa-stack-align-stretch sa-stack-gap-sm sa-stack-justify-start min-w-md">
    <button popovertarget="--popover-js-events" data-slot="button" class="sa-button sa-button-variant-outline sa-button-size-default">
        Toggle Popover
    </button>
    <div class="sa-field sa-field-orientation-horizontal" data-orientation="horizontal" data-slot="field"><span class="sa-input-control-wrapper"><input type="checkbox" id="--popover-prevent-checkbox" data-slot="input" class="sa-checkbox"><span class="sa-checkbox-indicator"><svg class="sa-checkbox-indicator-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></span></span><div class="sa-field-content" data-slot="field-content"><label for="--popover-prevent-checkbox" class="sa-label sa-field-label" data-slot="field-label">Prevent popover toggle</label></div></div>
    <label class="text-sm font-bold">Events:</label>
    <div class="font-mono w-full h-40 overflow-y-auto rounded-lg border border-border bg-muted p-3 text-foreground" id="--popover-js-events-output">
    </div>
</div>
<div id="--popover-js-events" class="sa-popover-content anchored-bottom-center mt-5" popover="" data-slot="popover-content" data-anchor-side="bottom">
    <div class="sa-stack sa-stack-align-stretch sa-stack-gap-md sa-stack-justify-start">
        <div class="sa-skeleton h-4 w-[250px]" data-slot="skeleton"></div>
        <div class="sa-skeleton h-4 w-[250px]" data-slot="skeleton"></div>
    </div>
</div>
<script>
    let counter = 0;
    const eventsPopover = document.getElementById('--popover-js-events');
    const eventsPopoverEventOutput = document.getElementById('--popover-js-events-output');
    const eventsPopoverPreventCheckbox = document.getElementById('--popover-prevent-checkbox');

    eventsPopover.addEventListener("beforetoggle", (e) => {
        if (eventsPopoverPreventCheckbox.checked === true) {
            eventsPopoverEventOutput.innerText = `${++counter}: Toggle prevented!\n` + eventsPopoverEventOutput.innerText;
            e.preventDefault();
            return;
        }
        eventsPopoverEventOutput.innerText = `${++counter}: Before toggle: ${e.oldState} -> ${e.newState}\n` + eventsPopoverEventOutput.innerText;
    });
    eventsPopover.addEventListener("toggle", (e) => {
        eventsPopoverEventOutput.innerText = `${++counter}: Toggle: ${e.oldState} -> ${e.newState}\n` + eventsPopoverEventOutput.innerText;
    });
</script>
<!-- code end -->

</div>



</body>
</html>
