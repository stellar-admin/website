<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (function () {
            var media = window.matchMedia('(prefers-color-scheme: dark)');
            function applyDark() {
                var theme = null;
                try { theme = localStorage.getItem('theme'); } catch (e) { }
                var dark = theme === 'dark' || (theme !== 'light' && media.matches);
                document.documentElement.classList.toggle('dark', dark);
                document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
            }
            window.saThemeInit = function () {
                window.saLoadThemeFonts('default');
            };
            applyDark();
            window.addEventListener('storage', function (e) {
                if (e.key === null || e.key === 'theme') applyDark();
            });
            media.addEventListener('change', applyDark);
        })();
    </script>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <script>window.saThemeFonts = {"default":"Inter:wght@400..700","ledger":"Lexend:wght@300..700","ops":"IBM\u002BPlex\u002BSans:wght@400;500;600;700","soft":"Figtree:wght@400..700"};</script>
    <script src="/demo/ui/assets/theme-fonts.qm7amh8j3s.js"></script>
    <link rel="stylesheet" href="/demo/ui/assets/site.lhm5lmseqz.css" />
    <link rel="stylesheet" href="/demo/ui/assets/stellar-admin.u0skg4117m.css" />
        <script>saThemeInit();</script>
    
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s;
        }
    </style>
    

    <script type="module" src="/demo/ui/assets/stellar-admin.05h1vlki0i.js"></script>
</head>
<body>
<script>
    window.addEventListener('load', function () {
        document.body.style.opacity = '1';
    });
</script>
<div class="preview flex w-full justify-center px-10 py-10">
    
    <div class="flex min-h-[380px] w-full flex-col items-center gap-4">
    <!-- code begin -->
    <sel-command id="--currency-command" class="sa-command h-auto w-full max-w-sm border shadow-md" data-slot="command" data-filter="client"><label class="sr-only" id="--currency-command-label">Display currency</label>
        <div class="sa-command-input-wrapper" data-slot="command-input-wrapper"><div class="sa-input-group sa-command-input-group" data-slot="input-group" role="group"><input placeholder="Search currencies..." type="text" id="--currency-command-input" aria-controls="--currency-command-list" aria-labelledby="--currency-command-label" role="combobox" aria-autocomplete="list" aria-expanded="true" autocomplete="off" autocorrect="off" spellcheck="false" data-slot="command-input" class="sa-command-input"><div class="sa-input-group-addon sa-input-group-addon-align-start" data-align="start" data-slot="input-group-addon" role="group"><svg class="sa-command-input-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></svg></div></div></div>
        <div id="--currency-command-list" role="listbox" aria-label="Suggestions" tabindex="-1" data-slot="command-list" class="sa-command-list">
            <div role="presentation" hidden="" data-slot="command-empty" class="sa-command-empty">No currency found.</div>
            <div role="presentation" data-slot="command-group" class="sa-command-group"><div aria-hidden="true" data-slot="command-group-heading" id="--currency-command-list-group-1-heading">Display prices in</div><div aria-labelledby="--currency-command-list-group-1-heading" role="group">
                <div role="option" aria-selected="false" tabindex="-1" data-slot="command-item" data-value="USD" data-keywords="us dollar united states" class="sa-command-item">
                    <span>US dollar</span>
                    <span class="text-muted-foreground">USD</span>
                <svg class="sa-command-item-indicator" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></div>
                <div role="option" aria-selected="false" tabindex="-1" data-slot="command-item" data-value="EUR" data-keywords="euro europe" data-checked="true" class="sa-command-item">
                    <span>Euro</span>
                    <span class="text-muted-foreground">EUR</span>
                <svg class="sa-command-item-indicator" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></div>
                <div role="option" aria-selected="false" tabindex="-1" data-slot="command-item" data-value="GBP" data-keywords="pound sterling united kingdom" class="sa-command-item">
                    <span>British pound</span>
                    <span class="text-muted-foreground">GBP</span>
                <svg class="sa-command-item-indicator" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></div>
                <div role="option" aria-selected="false" tabindex="-1" data-slot="command-item" data-value="JPY" data-keywords="yen japan" class="sa-command-item">
                    <span>Japanese yen</span>
                    <span class="text-muted-foreground">JPY</span>
                <svg class="sa-command-item-indicator" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></div>
                <div role="option" aria-selected="false" tabindex="-1" data-slot="command-item" data-value="ZAR" data-keywords="rand south africa" class="sa-command-item">
                    <span>South African rand</span>
                    <span class="text-muted-foreground">ZAR</span>
                <svg class="sa-command-item-indicator" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></div>
            </div></div>
        </div>
    </sel-command>
    <p class="text-muted-foreground text-sm" id="--currency-output">Prices are shown in EUR.</p>
    <script>
        (() => {
            const command = document.getElementById('--currency-command');
            const output = document.getElementById('--currency-output');

            // "itemselect" bubbles from the chosen item; move the check mark to it.
            command.addEventListener('itemselect', (event) => {
                command.querySelectorAll('[data-checked]').forEach((item) => item.removeAttribute('data-checked'));
                event.target.setAttribute('data-checked', 'true');
                output.textContent = `Prices are shown in ${event.detail.value}.`;
            });
        })();
    </script>
    <!-- code end -->
</div>


</div>



</body>
</html>
