    <script>
        (function () {
            var media = window.matchMedia('(prefers-color-scheme: dark)');
            function applyDark() {
                var theme = null;
                try { theme = localStorage.getItem('theme'); } catch (e) { }
                var dark = theme === 'dark' || (theme !== 'light' && media.matches);
                document.documentElement.classList.toggle('dark', dark);
                document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
            }
            window.saThemeInit = function () {
                window.saLoadThemeFonts('default');
            };
            applyDark();
            window.addEventListener('storage', function (e) {
                if (e.key === null || e.key === 'theme') applyDark();
            });
            media.addEventListener('change', applyDark);
        })();
    </script>

<button id="booking-selection-delete" class="sa-button sa-button-variant-destructive sa-button-size-default mt-4" hidden data-slot="button">
    Delete selected
</button>
<script>
    (() => {
        const selection = document.getElementById("booking-selection");
        const deleteButton = document.getElementById("booking-selection-delete");

        const syncButton = () => deleteButton.hidden = selection.selectedValues.length === 0;

        // rowselectionchange fires on every user-driven change; the initial
        // server-rendered selection is read once the component is defined.
        selection.addEventListener("rowselectionchange", syncButton);
        customElements.whenDefined("sel-table").then(syncButton);

        deleteButton.addEventListener("click", () =>
            alert(`Delete bookings:\n${selection.selectedValues.join("\n")}`));
    })();
</script>
