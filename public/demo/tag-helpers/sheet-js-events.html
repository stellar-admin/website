<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (function () {
            var themes = ['luma', 'lyra', 'maia', 'mira', 'nova', 'rhea', 'sera', 'vega'];
            var media = window.matchMedia('(prefers-color-scheme: dark)');
            function applyDark() {
                var theme = null;
                try { theme = localStorage.getItem('theme'); } catch (e) { }
                var dark = theme === 'dark' || (theme !== 'light' && media.matches);
                document.documentElement.classList.toggle('dark', dark);
                document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
            }
            function themeHref() {
                var theme = null;
                try { theme = localStorage.getItem('demo-theme'); } catch (e) { }
                if (themes.indexOf(theme) < 0) theme = 'nova';
                return '/demo/tag-helpers/assets/stellar-admin.' + theme + '.css';
            }
            window.saThemeInit = function () {
                var link = document.querySelector('link[data-sa-theme]');
                if (link && link.getAttribute('href') !== themeHref()) link.setAttribute('href', themeHref());
            };
            function swapTheme() {
                var links = document.querySelectorAll('link[data-sa-theme]');
                var current = links[links.length - 1];
                if (!current || current.getAttribute('href') === themeHref()) return;
                var next = document.createElement('link');
                next.rel = 'stylesheet';
                next.setAttribute('data-sa-theme', '');
                next.href = themeHref();
                next.addEventListener('load', function () {
                    if (!next.isConnected) return;
                    var all = document.querySelectorAll('link[data-sa-theme]');
                    for (var i = 0; i < all.length && all[i] !== next; i++) all[i].remove();
                });
                current.after(next);
            }
            applyDark();
            window.addEventListener('storage', function (e) {
                if (e.key === null || e.key === 'theme') applyDark();
                if (e.key === null || e.key === 'demo-theme') swapTheme();
            });
            media.addEventListener('change', applyDark);
        })();
    </script>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"/>
    <link rel="stylesheet" href="/demo/tag-helpers/assets/site.cbmh65v0kf.css" />
    <link rel="stylesheet" data-sa-theme href="/demo/tag-helpers/assets/stellar-admin.nova.css" /><script>saThemeInit();</script>
    
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s;
        }
    </style>
    

    <script defer src="/demo/tag-helpers/assets/stellar-admin.4b9ro4f5fa.js"></script>
</head>
<body>
<script>
    window.addEventListener('load', function () {
        document.body.style.opacity = '1';
    });
</script>
<div class="preview flex w-full justify-center px-10 py-10">
    
    <div class="min-h-[450px]">
    <!-- code begin -->
    <div class="sa-stack sa-stack-align-start sa-stack-gap-sm sa-stack-justify-start min-w-md">
        <button commandfor="--sheet-js-events-sheet" command="show-modal" data-slot="button" class="sa-button group/button sa-button-variant-outline sa-button-size-default">
            Open Sheet
        </button>
        <div class="sa-field group/field sa-field-orientation-horizontal" data-orientation="horizontal" data-slot="field"><span class="sa-input-control-wrapper"><input type="checkbox" id="--sheet-js-events-prevent-toggle-checkbox" data-slot="input" class="sa-checkbox peer"><span class="sa-checkbox-indicator"><svg class="sa-checkbox-indicator-icon" xmlns="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" height="24" width="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M20 6 9 17l-5-5"></path></svg></span></span><div data-slot="field-content" class="sa-field-content group/field-content"><label for="--sheet-js-events-prevent-toggle-checkbox" data-slot="field-label" class="sa-label sa-field-label group/field-label peer/field-label">PreventDefault() in beforetoggle event</label><p data-slot="field-description" class="sa-field-description">Will prevent the sheet from opening</p></div></div>
        <label class="text-sm font-bold">Events:</label>
        <div class="font-mono w-full h-40 overflow-y-auto bg-gray-50" id="--sheet-js-events-output">
        </div>
    </div>
    <sel-dialog><dialog id="--sheet-js-events-sheet" data-slot="sheet-content" data-side="right" class="sa-sheet-content"><button type="button" class="sa-button group/button sa-button-variant-ghost sa-button-size-icon-sm sa-sheet-close" commandfor="--sheet-js-events-sheet" command="close" data-slot="button"><svg class="size-4" xmlns="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" height="24" width="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg><span class="sr-only">Close</span></button><div class="sa-sheet-body">
        <div data-slot="sheet-header" class="sa-sheet-header">
            <h2 data-slot="sheet-title" class="sa-sheet-title sa-font-heading font-heading">Events</h2>
            <p data-slot="sheet-description" class="sa-sheet-description">This demonstrates the events on the sheet - or rather, the underlying dialog
            </p>
        </div>
        <div class="p-4">
            <div class="sa-field group/field sa-field-orientation-horizontal" data-orientation="horizontal" data-slot="field"><span class="sa-input-control-wrapper"><input type="checkbox" id="--sheet-js-events-prevent-cancel-checkbox" data-slot="input" class="sa-checkbox peer"><span class="sa-checkbox-indicator"><svg class="sa-checkbox-indicator-icon" xmlns="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" height="24" width="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M20 6 9 17l-5-5"></path></svg></span></span><div data-slot="field-content" class="sa-field-content group/field-content"><label for="--sheet-js-events-prevent-cancel-checkbox" data-slot="field-label" class="sa-label sa-field-label group/field-label peer/field-label">PreventDefault() in cancel event</label><p data-slot="field-description" class="sa-field-description">Will prevent the Request Close button from closing the sheet</p></div></div>
        </div>
        <div data-slot="sheet-footer" class="sa-sheet-footer">
            <button commandfor="--sheet-js-events-sheet" command="close" data-slot="button" class="sa-button group/button sa-button-variant-outline sa-button-size-default">
                Close
            </button>
            <button commandfor="--sheet-js-events-sheet" command="request-close" data-slot="button" class="sa-button group/button sa-button-variant-outline sa-button-size-default">
                Request Close
            </button>
        </div>
    </div></dialog></sel-dialog>
    <script>
        (function () {
            let counter = 0;
            const sheet = document.getElementById('--sheet-js-events-sheet');
            const output = document.getElementById('--sheet-js-events-output');
            const preventToggleCheckbox = document.getElementById('--sheet-js-events-prevent-toggle-checkbox');
            const preventCancelCheckbox = document.getElementById('--sheet-js-events-prevent-cancel-checkbox');

            sheet.addEventListener("beforetoggle", (e) => {
                if (preventToggleCheckbox.checked === true) {
                    output.innerText = `${++counter}: beforetoggle event prevented!\n` + output.innerText;
                    e.preventDefault();
                    return;
                }
                output.innerText = `${++counter}: beforetoggle event: ${e.oldState} -> ${e.newState}\n` + output.innerText;
            });
            sheet.addEventListener("toggle", (e) => {
                output.innerText = `${++counter}: toggle event: ${e.oldState} -> ${e.newState}\n` + output.innerText;
            });
            sheet.addEventListener("cancel", (e) => {
                if (preventCancelCheckbox.checked === true) {
                    output.innerText = `${++counter}: cancel event prevented!\n` + output.innerText;
                    e.preventDefault();
                    return;
                }
                output.innerText = `${++counter}: cancel event\n` + output.innerText;
            });
            sheet.addEventListener("close", (e) => {
                output.innerText = `${++counter}: close event\n` + output.innerText;
            });
        })();
    </script>
    <!-- code end -->
</div>


</div>



</body>
</html>
