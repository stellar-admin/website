<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"/>
    <link rel="stylesheet" href="/demo/tag-helpers/assets/site.yk0a9dj22n.css" />
    <link rel="stylesheet" href="/demo/tag-helpers/assets/stellar-admin.nova.cspk3t8uwa.css" />
    
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s;
        }
    </style>

    <script defer src="/demo/tag-helpers/assets/stellar-admin.r7faauge04.js"></script>
</head>
<body>
<script>
    window.addEventListener('load', function () {
        document.body.style.opacity = '1';
    });
</script>
<div class="preview flex w-full justify-center px-10 py-10">
    
    <div class="min-h-[300px]">
    <!-- code begin -->
    <div class="sa-stack sa-stack-align-center sa-stack-gap-sm sa-stack-justify-start">
        
            <button type="button" data-slot="dropdown-menu-trigger" aria-haspopup="menu" popovertarget="--sa-dropdown-menu-7e32d3a55ca4235ee46318403781668465ea018b42203709ef9f2ddf6ac0e47f7037" class="sa-button group/button sa-button-variant-outline sa-button-size-default">
                <svg class="text-muted-foreground" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>
                Booking Status
            </button>
            <sel-dropdown-menu class="sa-dropdown-menu-content sa-dropdown-menu-content-logical dark anchored-bottom-span-right w-56" id="--sa-dropdown-menu-7e32d3a55ca4235ee46318403781668465ea018b42203709ef9f2ddf6ac0e47f7037" popover="" role="menu" data-slot="dropdown-menu-content" data-anchor-side="bottom" data-side="bottom">
                <div data-slot="dropdown-menu-label" class="sa-dropdown-menu-label">Filter by Status</div>
                <div role="separator" aria-orientation="horizontal" data-slot="dropdown-menu-separator" class="sa-dropdown-menu-separator"></div>
                <!-- Listen once on the group; the event bubbles up from the selected radio item -->
                <div id="--booking-status" role="group" data-slot="dropdown-menu-radio-group" data-radio-group="--sa-dropdown-menu-radio-7e32d3a55ca4235ee46318403781668465ea018b42203709ef9f2ddf6ac0e47f13147">
                    <div role="menuitemradio" tabindex="-1" aria-checked="true" data-slot="dropdown-menu-radio-item" data-state="checked" data-value="confirmed" data-radio-group="--sa-dropdown-menu-radio-7e32d3a55ca4235ee46318403781668465ea018b42203709ef9f2ddf6ac0e47f13147" class="sa-dropdown-menu-radio-item"><span class="sa-dropdown-menu-item-indicator" data-slot="dropdown-menu-radio-item-indicator"><svg class="size-4" fill="none" stroke-linejoin="round" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg" height="24" stroke-width="2" viewBox="0 0 24 24" width="24" stroke="currentColor"><path d="M20 6 9 17l-5-5"></path></svg></span>Confirmed</div>
                    <div role="menuitemradio" tabindex="-1" aria-checked="false" data-slot="dropdown-menu-radio-item" data-state="unchecked" data-value="pending" data-radio-group="--sa-dropdown-menu-radio-7e32d3a55ca4235ee46318403781668465ea018b42203709ef9f2ddf6ac0e47f13147" class="sa-dropdown-menu-radio-item"><span class="sa-dropdown-menu-item-indicator hidden" data-slot="dropdown-menu-radio-item-indicator"><svg class="size-4" fill="none" stroke-linejoin="round" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg" height="24" stroke-width="2" viewBox="0 0 24 24" width="24" stroke="currentColor"><path d="M20 6 9 17l-5-5"></path></svg></span>Pending</div>
                    <div role="menuitemradio" tabindex="-1" aria-checked="false" data-slot="dropdown-menu-radio-item" data-state="unchecked" data-value="cancelled" data-radio-group="--sa-dropdown-menu-radio-7e32d3a55ca4235ee46318403781668465ea018b42203709ef9f2ddf6ac0e47f13147" class="sa-dropdown-menu-radio-item"><span class="sa-dropdown-menu-item-indicator hidden" data-slot="dropdown-menu-radio-item-indicator"><svg class="size-4" fill="none" stroke-linejoin="round" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg" height="24" stroke-width="2" viewBox="0 0 24 24" width="24" stroke="currentColor"><path d="M20 6 9 17l-5-5"></path></svg></span>Cancelled</div>
                </div>
            </sel-dropdown-menu>
        
        <p class="text-muted-foreground text-sm" id="--booking-status-output"></p>
    </div>
    <script>
        (() => {
            const labels = { confirmed: 'Confirmed', pending: 'Pending', cancelled: 'Cancelled' };
            const output = document.getElementById('--booking-status-output');
            const show = (value) => {
                output.textContent = 'Showing: ' + (labels[value] ?? value) + ' bookings';
            };

            // A single listener on the group gets the selected value from event.detail.value
            // (event.target is the chosen item, if you need the element too). The menu stays open.
            document.getElementById('--booking-status').addEventListener('valuechange', (event) => {
                show(event.detail.value);
            });

            show('confirmed'); // reflect the group's initial value
        })();
    </script>
    <!-- code end -->
</div>


</div>



</body>
</html>
