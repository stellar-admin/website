<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>

    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"/>

    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s;

    <script defer src="/demo/tag-helpers/assets/stellar-admin.r7faauge04.js"></script>

<body>
<script>
    window.addEventListener('load', function () {
        document.body.style.opacity = '1';
    });
</script>
<div class="preview flex w-full justify-center px-10 py-10">
    
    <div class="max-w-[500px]">
    <!-- code begin -->
    <div class="sa-field group/field sa-field-orientation-vertical [&amp;&gt;*]:w-full [&amp;&gt;.sr-only]:w-auto" data-orientation="vertical" data-slot="field">
        <label for="amount" data-slot="label" class="sa-label">Amount</label>
        <div role="group" data-slot="button-group" data-orientation="horizontal" class="sa-button-group sa-button-group-orientation-horizontal">
            <div data-slot="native-select-wrapper" data-size="default" class="sa-native-select-wrapper group/native-select"><select data-slot="native-select" data-size="default" class="sa-native-select">
                <option>$</option>
                <option>€</option>
                <option>£</option>
            </select><svg class="sa-native-select-icon" aria-hidden="true" data-slot="native-select-icon" fill="none" stroke-linejoin="round" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg" height="24" stroke-width="2" viewBox="0 0 24 24" width="24" stroke="currentColor"><path d="m6 9 6 6 6-6"></path></svg></div>
            <input id="amount" placeholder="Enter amount to send" data-slot="input" class="sa-input"></input>
            <button data-slot="button" class="sa-button group/button sa-button-variant-outline sa-button-size-default">
                <svg fill="none" stroke-linejoin="round" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg" height="24" stroke-width="2" viewBox="0 0 24 24" width="24" stroke="currentColor"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
            </button>
        </div>
    </div>
    <!-- code end -->
</div>

</div>
