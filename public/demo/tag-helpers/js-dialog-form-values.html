<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (function () {
            var media = window.matchMedia('(prefers-color-scheme: dark)');
            function applyTheme() {
                var theme = null;
                try { theme = localStorage.getItem('theme'); } catch (e) { }
                var dark = theme === 'dark' || (theme !== 'light' && media.matches);
                document.documentElement.classList.toggle('dark', dark);
                document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
            }
            applyTheme();
            window.addEventListener('storage', function (e) {
                if (e.key === null || e.key === 'theme') applyTheme();
            });
            media.addEventListener('change', applyTheme);
        })();
    </script>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>

<script>

<div class="preview flex w-full justify-center px-10 py-10">

                    <label for="--js-dialog-form-values-name" data-slot="label" class="sa-label">Name</label>
                    <input id="--js-dialog-form-values-name" name="name" defaultValue="Ibn Battuta" required data-slot="input" class="sa-input"></input>
                </div>
                <div class="sa-field group/field sa-field-orientation-vertical [&amp;&gt;*]:w-full [&amp;&gt;.sr-only]:w-auto" data-orientation="vertical" data-slot="field">

                    Save Changes

        </form>
    </dialog></sel-dialog>
    <script type="module">
        (function () {
            const dialog = window.stellarAdmin.dialog(document.getElementById("--dialog-return-form-value-helper"));
            const button = document.getElementById("--js-dialog-form-values-button");
            const resultDisplay = document.getElementById("--js-dialog-form-values-result");

            button.addEventListener("click", async (event) => {
                const result = await dialog.showAsync();
                resultDisplay.innerHTML = JSON.stringify(result, null, 4);
            });
        })();
