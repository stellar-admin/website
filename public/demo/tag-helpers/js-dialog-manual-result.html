<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"/>
    <link rel="stylesheet" href="/demo/tag-helpers/assets/site.yk0a9dj22n.css" />
    <link rel="stylesheet" href="/demo/tag-helpers/assets/stellar-admin.nova.cspk3t8uwa.css" />
    
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s;
        }
    </style>

    <script defer src="/demo/tag-helpers/assets/stellar-admin.r7faauge04.js"></script>
</head>
<body>
<script>
    window.addEventListener('load', function () {
        document.body.style.opacity = '1';
    });
</script>
<div class="preview flex w-full justify-center px-10 py-10">
    
    <div class="min-h-[450px]">
    <!-- code begin -->
    <div class="sa-stack sa-stack-align-start sa-stack-gap-md sa-stack-justify-start min-w-md">
        <button id="--js-dialog-manual-button" data-slot="button" class="sa-button group/button sa-button-variant-outline sa-button-size-default">
            Open Dialog
        </button>
        <label class="text-sm font-bold">Result:</label>
        <div class="font-mono w-full h-40 overflow-y-auto bg-gray-50" id="--js-dialog-manual-result">-</div>
    </div>
    <sel-dialog><dialog id="--js-dialog-manual-dialog" data-slot="dialog-content" class="sa-dialog-content">
        <div data-slot="dialog-header" class="sa-dialog-header">
            <h2 data-slot="dialog-title" class="sa-dialog-title sa-font-heading font-heading">Manual Result</h2>
            <p data-slot="dialog-description" class="sa-dialog-description">
                Demonstrates how you can manually return a result.
            </p>
        </div>
        <div data-slot="dialog-footer" class="sa-dialog-footer">
            <button id="-js-dialog-manual-button-cancel" data-slot="button" class="sa-button group/button sa-button-variant-outline sa-button-size-default">
                Cancel
            </button>
            <button id="-js-dialog-manual-button-confirm" data-slot="button" class="sa-button group/button sa-button-variant-outline sa-button-size-default">
                Confirm
            </button>
            <button id="-js-dialog-manual-button-confirm-with-data" data-slot="button" class="sa-button group/button sa-button-variant-outline sa-button-size-default">
                Confirm with Data
            </button>
        </div>
    </dialog></sel-dialog>
    <script type="module">
        (function () {
            const dialog = window.stellarAdmin.dialog(document.getElementById("--js-dialog-manual-dialog"));
            const resultDisplay = document.getElementById("--js-dialog-manual-result");
            const triggerButton = document.getElementById("--js-dialog-manual-button");
            const cancelButton = document.getElementById("-js-dialog-manual-button-cancel");
            const confirmButton = document.getElementById("-js-dialog-manual-button-confirm");
            const confirmWithDataButton = document.getElementById("-js-dialog-manual-button-confirm-with-data");

            triggerButton.addEventListener("click", async (event) => {
                const result = await dialog.showAsync();
                resultDisplay.innerHTML = JSON.stringify(result, null, 4);
            });
            cancelButton.addEventListener("click", async (event) => {
                dialog.cancel();
            });
            confirmButton.addEventListener("click", async (event) => {
                dialog.confirm();
            });
            confirmWithDataButton.addEventListener("click", async (event) => {
                dialog.confirm({name: "Ibn", surname: "Battutta"});
            });
        })();
    </script>
    <!-- code end -->
</div>

</div>



</body>
</html>
