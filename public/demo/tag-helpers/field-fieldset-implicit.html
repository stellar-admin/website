<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"/>
    <link rel="stylesheet" href="/demo/tag-helpers/assets/site.yk0a9dj22n.css" />
    <link rel="stylesheet" href="/demo/tag-helpers/assets/stellar-admin.nova.cspk3t8uwa.css" />
    
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s;
        }
    </style>

    <script defer src="/demo/tag-helpers/assets/stellar-admin.r7faauge04.js"></script>
</head>
<body>
<script>
    window.addEventListener('load', function () {
        document.body.style.opacity = '1';
    });
</script>
<div class="preview flex w-full justify-center px-10 py-10">
    
    
<div class="w-full max-w-md space-y-6">
    <!-- code begin -->
    <fieldset data-slot="field-set" class="sa-field-set">
        <legend data-slot="field-legend" data-variant="legend" class="sa-field-legend">Address Information</legend>
        <p data-slot="field-description" class="sa-field-description">
            We need your address to deliver your order.
        </p>
        <div data-slot="field-group" class="sa-field-group group/field-group">
            <div class="sa-field group/field sa-field-orientation-vertical [&amp;&gt;*]:w-full [&amp;&gt;.sr-only]:w-auto" data-orientation="vertical" data-slot="field"><label data-slot="field-label" class="sa-label sa-field-label group/field-label peer/field-label" for="PartialModel_Street">Street Address</label><input type="text" id="PartialModel_Street" name="PartialModel.Street" placeholder="123 Main St" value="" data-slot="input" class="sa-input"></input><div class="sa-field-error field-validation-valid" data-valmsg-for="PartialModel.Street" data-valmsg-replace="true" role="alert" data-slot="field-error"></div></div>
            <div class="grid grid-cols-2 gap-4">
                <div class="sa-field group/field sa-field-orientation-vertical [&amp;&gt;*]:w-full [&amp;&gt;.sr-only]:w-auto" data-orientation="vertical" data-slot="field"><label data-slot="field-label" class="sa-label sa-field-label group/field-label peer/field-label" for="PartialModel_City">City</label><input type="text" id="PartialModel_City" name="PartialModel.City" placeholder="New York" value="" data-slot="input" class="sa-input"></input><div class="sa-field-error field-validation-valid" data-valmsg-for="PartialModel.City" data-valmsg-replace="true" role="alert" data-slot="field-error"></div></div>
                <div class="sa-field group/field sa-field-orientation-vertical [&amp;&gt;*]:w-full [&amp;&gt;.sr-only]:w-auto" data-orientation="vertical" data-slot="field"><label data-slot="field-label" class="sa-label sa-field-label group/field-label peer/field-label" for="PartialModel_PostalCode">Postal Code</label><input type="text" id="PartialModel_PostalCode" name="PartialModel.PostalCode" placeholder="90502" value="" data-slot="input" class="sa-input"></input><div class="sa-field-error field-validation-valid" data-valmsg-for="PartialModel.PostalCode" data-valmsg-replace="true" role="alert" data-slot="field-error"></div></div>
            </div>
        </div>
    </fieldset>
    <!-- code end -->
</div>

</div>



</body>
</html>
