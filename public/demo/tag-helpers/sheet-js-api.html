<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (function () {
            var themes = ['luma', 'lyra', 'maia', 'mira', 'nova', 'rhea', 'sera', 'vega'];
            var media = window.matchMedia('(prefers-color-scheme: dark)');
            function applyDark() {
                var theme = null;
                try { theme = localStorage.getItem('theme'); } catch (e) { }
                var dark = theme === 'dark' || (theme !== 'light' && media.matches);
                document.documentElement.classList.toggle('dark', dark);
                document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
            }
            function themeHref() {
                var theme = null;
                try { theme = localStorage.getItem('demo-theme'); } catch (e) { }
                if (themes.indexOf(theme) < 0) theme = 'nova';
                return '/demo/tag-helpers/assets/stellar-admin.' + theme + '.css';
            }
            window.saThemeInit = function () {
                var link = document.querySelector('link[data-sa-theme]');
                if (link && link.getAttribute('href') !== themeHref()) link.setAttribute('href', themeHref());
            };
            function swapTheme() {
                var links = document.querySelectorAll('link[data-sa-theme]');
                var current = links[links.length - 1];
                if (!current || current.getAttribute('href') === themeHref()) return;
                var next = document.createElement('link');
                next.rel = 'stylesheet';
                next.setAttribute('data-sa-theme', '');
                next.href = themeHref();
                next.addEventListener('load', function () {
                    if (!next.isConnected) return;
                    var all = document.querySelectorAll('link[data-sa-theme]');
                    for (var i = 0; i < all.length && all[i] !== next; i++) all[i].remove();
                });
                current.after(next);
            }
            applyDark();
            window.addEventListener('storage', function (e) {
                if (e.key === null || e.key === 'theme') applyDark();
                if (e.key === null || e.key === 'demo-theme') swapTheme();
            });
            media.addEventListener('change', applyDark);
        })();
    </script>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"/>
    <link rel="stylesheet" href="/demo/tag-helpers/assets/site.dut8bg9zqu.css" />
    <link rel="stylesheet" data-sa-theme href="/demo/tag-helpers/assets/stellar-admin.nova.css" /><script>saThemeInit();</script>
    
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s;
        }
    </style>

    <script defer src="/demo/tag-helpers/assets/stellar-admin.0frsvhd7es.js"></script>
</head>
<body>
<script>
    window.addEventListener('load', function () {
        document.body.style.opacity = '1';
    });
</script>
<div class="preview flex w-full justify-center px-10 py-10">
    
    <div class="min-h-[450px]">
    <!-- code begin -->
    <div class="sa-group sa-group-align-start sa-group-gap-md sa-group-justify-center">
        <button id="--sheet-js-api-show-modal-button" data-slot="button" class="sa-button group/button sa-button-variant-outline sa-button-size-default">
            Show Modal
        </button>
        <button id="--sheet-js-api-show-button" data-slot="button" class="sa-button group/button sa-button-variant-outline sa-button-size-default">
            Show
        </button>
    </div>
    <sel-dialog><dialog id="--sheet-js-api-sheet" data-slot="sheet-content" data-side="right" class="sa-sheet-content"><button type="button" class="sa-button group/button sa-button-variant-ghost sa-button-size-icon-sm sa-sheet-close" commandfor="--sheet-js-api-sheet" command="close" data-slot="button"><svg class="size-4" fill="none" stroke-width="2" stroke="currentColor" xmlns="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round" height="24" viewBox="0 0 24 24" width="24"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg><span class="sr-only">Close</span></button><div class="sa-sheet-body">
        <div data-slot="sheet-header" class="sa-sheet-header">
            <h2 data-slot="sheet-title" class="sa-sheet-title sa-font-heading font-heading">JavaScript API</h2>
            <p data-slot="sheet-description" class="sa-sheet-description">You can open and close this sheet using the dialog JS API</p>
        </div>
        <div data-slot="sheet-footer" class="sa-sheet-footer">
            <button id="--sheet-js-api-close-button" data-slot="button" class="sa-button group/button sa-button-variant-outline sa-button-size-default">
                Close via JS
            </button>
        </div>
    </div></dialog></sel-dialog>
    <script>
        (function() {
            const sheet = document.getElementById("--sheet-js-api-sheet");
            const showModalButton = document.getElementById("--sheet-js-api-show-modal-button");
            const showButton = document.getElementById("--sheet-js-api-show-button");
            const closeButton = document.getElementById("--sheet-js-api-close-button");

            showModalButton.addEventListener("click", () => {
                sheet.showModal();
            });

            showButton.addEventListener("click", () => {
                sheet.show();
            });

            closeButton.addEventListener("click", () => {
                sheet.close();
            });
        })();
    </script>
    <!-- code end -->
</div>

</div>



</body>
</html>
