<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (function () {
            var themes = ['luma', 'lyra', 'maia', 'mira', 'nova', 'rhea', 'sera', 'vega'];
            var media = window.matchMedia('(prefers-color-scheme: dark)');
            function applyDark() {
                var theme = null;
                try { theme = localStorage.getItem('theme'); } catch (e) { }
                var dark = theme === 'dark' || (theme !== 'light' && media.matches);
                document.documentElement.classList.toggle('dark', dark);
                document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
            }
            function themeHref() {
                var theme = null;
                try { theme = localStorage.getItem('demo-theme'); } catch (e) { }
                if (themes.indexOf(theme) < 0) theme = 'nova';
                return '/demo/tag-helpers/assets/stellar-admin.' + theme + '.css';
            }
            window.saThemeInit = function () {
                var link = document.querySelector('link[data-sa-theme]');
                if (link && link.getAttribute('href') !== themeHref()) link.setAttribute('href', themeHref());
            };
            function swapTheme() {
                var links = document.querySelectorAll('link[data-sa-theme]');
                var current = links[links.length - 1];
                if (!current || current.getAttribute('href') === themeHref()) return;
                var next = document.createElement('link');
                next.rel = 'stylesheet';
                next.setAttribute('data-sa-theme', '');
                next.href = themeHref();
                next.addEventListener('load', function () {
                    if (!next.isConnected) return;
                    var all = document.querySelectorAll('link[data-sa-theme]');
                    for (var i = 0; i < all.length && all[i] !== next; i++) all[i].remove();
                });
                current.after(next);
            }
            applyDark();
            window.addEventListener('storage', function (e) {
                if (e.key === null || e.key === 'theme') applyDark();
                if (e.key === null || e.key === 'demo-theme') swapTheme();
            });
            media.addEventListener('change', applyDark);
        })();
    </script>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"/>
    <link rel="stylesheet" href="/demo/tag-helpers/assets/site.dut8bg9zqu.css" />
    <link rel="stylesheet" data-sa-theme href="/demo/tag-helpers/assets/stellar-admin.nova.css" /><script>saThemeInit();</script>
    
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s;
        }
    </style>

    <script defer src="/demo/tag-helpers/assets/stellar-admin.0frsvhd7es.js"></script>
</head>
<body>
<script>
    window.addEventListener('load', function () {
        document.body.style.opacity = '1';
    });
</script>
<div class="preview flex w-full justify-center px-10 py-10">
    
    <div class="py-10">
    <!-- code begin -->
    <div class="sa-stack sa-stack-align-center sa-stack-gap-md sa-stack-justify-start">
        <button interestfor="--tooltip-js-api" id="--tooltip-js-api-button" data-slot="button" class="sa-button group/button sa-button-variant-outline sa-button-size-icon-sm">
            <svg stroke-linejoin="round" stroke-width="2" height="24" stroke="currentColor" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" fill="none" stroke-linecap="round"><path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5c0 1.1.9 2 2 2h1"></path><path d="M16 21h1a2 2 0 0 0 2-2v-5c0-1.1.9-2 2-2a2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1"></path></svg>
        </button>
        <div class="sa-group sa-group-align-start sa-group-gap-md sa-group-justify-start">
            <button id="--tooltip-js-api-open" data-slot="button" class="sa-button group/button sa-button-variant-outline sa-button-size-default">
                Open
            </button>
            <button id="--tooltip-js-api-close" data-slot="button" class="sa-button group/button sa-button-variant-outline sa-button-size-default">
                Close
            </button>
            <button id="--tooltip-js-api-toggle" data-slot="button" class="sa-button group/button sa-button-variant-outline sa-button-size-default">
                Toggle
            </button>
        </div>
    </div>
    <div id="--tooltip-js-api" popover="manual" data-slot="tooltip-content" data-anchor-side="top" class="sa-tooltip-content anchored-top">
        This tooltip can be controlled via the Popover JS API
    </div>
    <script>
        const apiTooltip = document.getElementById('--tooltip-js-api');
        const apiTooltipButton = document.getElementById('--tooltip-js-api-button');
        const apiTooltipOpenButton = document.getElementById('--tooltip-js-api-open');
        const apiTooltipCloseButton = document.getElementById('--tooltip-js-api-close');
        const apiTooltipToggleButton = document.getElementById('--tooltip-js-api-toggle');

        apiTooltipOpenButton.addEventListener('click', () => {
            apiTooltip.showPopover({
                source: apiTooltipButton
            });
        });
        apiTooltipCloseButton.addEventListener('click', () => {
            apiTooltip.hidePopover();
        });
        apiTooltipToggleButton.addEventListener('click', () => {
            apiTooltip.togglePopover({
                source: apiTooltipButton
            });
        });
    </script>
    <!-- code end -->
</div>

</div>



</body>
</html>
