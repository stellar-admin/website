<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (function () {
            var themes = ['aurora', 'concourse', 'ice', 'ledger', 'meridian', 'observatory', 'parallax', 'shadcn.luma', 'shadcn.lyra', 'shadcn.maia', 'shadcn.mira', 'shadcn.nova', 'shadcn.rhea', 'shadcn.sera', 'shadcn.vega'];
            var media = window.matchMedia('(prefers-color-scheme: dark)');
            function applyDark() {
                var theme = null;
                try { theme = localStorage.getItem('theme'); } catch (e) { }
                var dark = theme === 'dark' || (theme !== 'light' && media.matches);
                document.documentElement.classList.toggle('dark', dark);
                document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
            }
            function selectedTheme() {
                var theme = null;
                try { theme = localStorage.getItem('demo-theme'); } catch (e) { }
                if (themes.indexOf(theme) < 0) theme = 'observatory';
                return theme;
            }
            function themeHref() {
                return '/demo/tag-helpers/assets/stellar-admin.' + selectedTheme() + '.css';
            }
            window.saThemeInit = function () {
                window.saLoadThemeFonts(selectedTheme());
                var link = document.querySelector('link[data-sa-theme]');
                if (link && link.getAttribute('href') !== themeHref()) link.setAttribute('href', themeHref());
            };
            function swapTheme() {
                window.saLoadThemeFonts(selectedTheme());
                var links = document.querySelectorAll('link[data-sa-theme]');
                var current = links[links.length - 1];
                if (!current || current.getAttribute('href') === themeHref()) return;
                var next = document.createElement('link');
                next.rel = 'stylesheet';
                next.setAttribute('data-sa-theme', '');
                next.href = themeHref();
                next.addEventListener('load', function () {
                    if (!next.isConnected) return;
                    var all = document.querySelectorAll('link[data-sa-theme]');
                    for (var i = 0; i < all.length && all[i] !== next; i++) all[i].remove();
                });
                current.after(next);
            }
            applyDark();
            window.addEventListener('storage', function (e) {
                if (e.key === null || e.key === 'theme') applyDark();
                if (e.key === null || e.key === 'demo-theme') swapTheme();
            });
            media.addEventListener('change', applyDark);
        })();
    </script>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <script src="/demo/tag-helpers/assets/theme-fonts.vqsfb4uqta.js"></script>
    <link rel="stylesheet" href="/demo/tag-helpers/assets/site.hlh5wjijdw.css" />
    <link rel="stylesheet" data-sa-theme href="/demo/tag-helpers/assets/stellar-admin.observatory.css" /><script>saThemeInit();</script>
    
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s;
        }
    </style>
    

    <script defer src="/demo/tag-helpers/assets/stellar-admin.vhjnnhza0z.js"></script>
</head>
<body>
<script>
    window.addEventListener('load', function () {
        document.body.style.opacity = '1';

</script>

-linejoin="round" stroke="currentColor" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg></span><div class="sa-toast-text" data-slot="toast-text"><div class="sa-toast-title" data-slot="toast-title"></div><div class="sa-toast-description" data-slot="toast-description"></div></div><a data-slot="toast-action" class="sa-button group/button sa-button-variant-outline sa-button-size-sm sa-toast-action"></a><button type="button" data-slot="toast-close" aria-label="Close toast" class="sa-button group/button sa-button-variant-ghost sa-button-size-icon-sm sa-toast-close"><svg aria-hidden="true" fill="none" xmlns="http://www.w3.org/2000/svg" stroke-linecap="round" height="24" width="24" stroke-width="2" stroke-linejoin="round" stroke="currentColor" viewBox="0 0 24 24"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div></div></template><div aria-atomic="false" aria-label="Notifications" aria-live="polite" aria-relevant="additions text" class="sa-toast-viewport" data-position="bottom-right" data-slot="toast-viewport" popover="manual" role="region" tabindex="-1"><div aria-live="assertive" class="sr-only" data-slot="toast-announcer"></div></div></sel-toaster>
    <script type="module">
        const toast = window.stellarAdmin.toast;
        const types = {
            default: () => toast.add({ title: "Itinerary archived", description: "3 bookings moved to archive." }),
            success: () => toast.success("Booking confirmed", "Your trip to Lisbon departs 14 October."),
            info: () => toast.info("Fare alert", "Flights to Kyoto dropped 12% this week."),
            warning: () => toast.warning("Passport expires soon", "Renew it before your March trip to Cape Town."),
            error: () => toast.error("Payment declined", "Your card ending 4242 was declined."),
            loading: () => toast.add({ title: "Checking seat availability...", type: "loading", duration: 3000 }),
        };

        document.querySelectorAll("[data-toast-type]").forEach((button) =>
            button.addEventListener("click", () => types[button.dataset.toastType]()));
    </script>
    <!-- code end -->
</div>


</div>
