<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (function () {
            var media = window.matchMedia('(prefers-color-scheme: dark)');
            function applyTheme() {
                var theme = null;
                try { theme = localStorage.getItem('theme'); } catch (e) { }
                var dark = theme === 'dark' || (theme !== 'light' && media.matches);
                document.documentElement.classList.toggle('dark', dark);
                document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
            }
            applyTheme();
            window.addEventListener('storage', function (e) {
                if (e.key === null || e.key === 'theme') applyTheme();
            });
            media.addEventListener('change', applyTheme);
        })();
    </script>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"/>
    <link rel="stylesheet" href="/demo/tag-helpers/assets/site.yk0a9dj22n.css" />
    <link rel="stylesheet" href="/demo/tag-helpers/assets/stellar-admin.nova.cspk3t8uwa.css" />
    
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s;
        }
    </style>

    <script defer src="/demo/tag-helpers/assets/stellar-admin.r7faauge04.js"></script>
</head>
<body>
<script>
    window.addEventListener('load', function () {
        document.body.style.opacity = '1';
    });
</script>
<div class="preview flex w-full justify-center px-10 py-10">
    
    <!-- code begin -->
<div class="sa-stack sa-stack-align-stretch sa-stack-gap-sm sa-stack-justify-start min-w-md">
    <button popovertarget="--popover-js-events" data-slot="button" class="sa-button group/button sa-button-variant-outline sa-button-size-default">
        Toggle Popover
    </button>
    <div class="sa-field group/field sa-field-orientation-horizontal" data-orientation="horizontal" data-slot="field"><span class="sa-input-control-wrapper"><input type="checkbox" id="--popover-prevent-checkbox" data-slot="input" class="sa-checkbox peer"></input><span class="sa-checkbox-indicator"><svg class="sa-checkbox-indicator-icon" xmlns="http://www.w3.org/2000/svg" stroke-linecap="round" fill="none" stroke-width="2" stroke="currentColor" width="24" height="24" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"></path></svg></span></span><div data-slot="field-content" class="sa-field-content group/field-content"><label data-slot="field-label" class="sa-label sa-field-label group/field-label peer/field-label">Prevent popover toggle</label></div></div>
    <label class="text-sm font-bold">Events:</label>
    <div class="font-mono w-full h-40 overflow-y-auto bg-gray-50" id="--popover-js-events-output">
    </div>
</div>
<div id="--popover-js-events" class="sa-popover-content anchored-bottom mt-5" popover="" data-slot="popover-content" data-anchor-side="bottom">
    <div class="sa-stack sa-stack-align-stretch sa-stack-gap-md sa-stack-justify-start">
        <div class="sa-skeleton h-4 w-[250px]" data-slot="skeleton"></div>
        <div class="sa-skeleton h-4 w-[250px]" data-slot="skeleton"></div>
    </div>
</div>
<script>
    let counter = 0;
    const eventsPopover = document.getElementById('--popover-js-events');
    const eventsPopoverEventOutput = document.getElementById('--popover-js-events-output');
    const eventsPopoverPreventCheckbox = document.getElementById('--popover-prevent-checkbox');

    eventsPopover.addEventListener("beforetoggle", (e) => {
        if (eventsPopoverPreventCheckbox.checked === true) {
            eventsPopoverEventOutput.innerText = `${++counter}: Toggle prevented!\n` + eventsPopoverEventOutput.innerText;
            e.preventDefault();
            return;
        }
        eventsPopoverEventOutput.innerText = `${++counter}: Before toggle: ${e.oldState} -> ${e.newState}\n` + eventsPopoverEventOutput.innerText;
    });
    eventsPopover.addEventListener("toggle", (e) => {
        eventsPopoverEventOutput.innerText = `${++counter}: Toggle: ${e.oldState} -> ${e.newState}\n` + eventsPopoverEventOutput.innerText;
    });
</script>
<!-- code end -->

</div>



</body>
</html>
