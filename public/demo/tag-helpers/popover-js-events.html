        Toggle Popover
    </button>
    <div class="data-[invalid=true]:text-destructive gap-2 group/field flex w-full flex-row items-center [&amp;&gt;[data-slot=field-label]]:flex-auto has-[&gt;[data-slot=field-content]]:items-start has-[&gt;[data-slot=field-content]]:[&amp;&gt;[role=checkbox],[role=radio]]:mt-px" data-orientation="horizontal" data-slot="field"><span class="relative flex items-center"><input type="checkbox" id="--popover-prevent-checkbox" data-slot="input" class="border-input dark:bg-input/30 checked:bg-primary checked:text-primary-foreground dark:checked:bg-primary checked:border-primary aria-invalid:aria-checked:border-primary aria-invalid:border-destructive dark:aria-invalid:border-destructive/50 focus-visible:border-ring focus-visible:ring-ring/50 aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 flex size-4 items-center justify-center rounded-[4px] border transition-colors group-has-disabled/field:opacity-50 focus-visible:ring-3 [&amp;.input-validation-error]:aria-checked:border-primary [&amp;.input-validation-error]:border-destructive dark:[&amp;.input-validation-error]:border-destructive/50 [&amp;.input-validation-error]:ring-destructive/20 dark:[&amp;.input-validation-error]:ring-destructive/40 peer relative shrink-0 outline-none after:absolute after:-inset-x-3 after:-inset-y-2 disabled:cursor-not-allowed disabled:opacity-50 before:content[&#x27;&#x27;] appearance-none"></input><span class="[&amp;&gt;svg]:size-3.5 invisible peer-checked:visible"><svg class="pointer-events-none absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-neutral-100 dark:text-black" xmlns="http://www.w3.org/2000/svg" stroke-width="2" width="24" fill="none" stroke-linecap="round" viewBox="0 0 24 24" height="24" stroke-linejoin="round" stroke="currentColor"><path d="M20 6 9 17l-5-5"></path></svg></span></span><div data-slot="field-content" class="gap-0.5 group/field-content flex flex-1 flex-col leading-snug"><label data-slot="field-label" class="text-sm font-medium group <div id="--popover-js-events" class="bg-popover text-popover-foreground ring-foreground/10 gap-2.5 rounded-lg p-2.5 text-sm shadow-md ring-1 w-72 outline-hidden try-flip-all anchored-bottom duration-200 ease-in opacity-100 not-open:opacity-0 starting:open:opacity-0 [transition-property:opacity,display,overlay] [transition-behavior:allow-discrete] mt-5" popover="" data-slot="popover-content">
    <div class="flex flex-col items-stretch gap-y-4 justify-start">
        <div class="bg-muted rounded-md animate-pulse h-4 w-[250px]" data-slot="skeleton"></div>
        <div class="bg-muted rounded-md animate-pulse h-4 w-[250px]" data-slot="skeleton"></div>
    </div>
</div>
<script>
    let counter = 0;
    const eventsPopover = document.getElementById('--popover-js-events');
    const eventsPopoverEventOutput = document.getElementById('--popover-js-events-output');
    const eventsPopoverPreventCheckbox = document.getElementById('--popover-prevent-checkbox');

    eventsPopover.addEventListener("beforetoggle", (e) => {
        if (eventsPopoverPreventCheckbox.checked === true) {
            eventsPopoverEventOutput.innerText = `${++counter}: Toggle prevented!\n` + eventsPopoverEventOutput.innerText;
            e.preventDefault();
            return;
        }
        eventsPopoverEventOutput.innerText = `${++counter}: Before toggle: ${e.oldState} -> ${e.newState}\n` + eventsPopoverEventOutput.innerText;
    });
    eventsPopover.addEventListener("toggle", (e) => {
        eventsPopoverEventOutput.innerText = `${++counter}: Toggle: ${e.oldState} -> ${e.newState}\n` + eventsPopoverEventOutput.innerText;
    });
</script>
<!-- code end -->

</div>
