<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (function () {
            var themes = ['aurora', 'concourse', 'ice', 'ledger', 'meridian', 'observatory', 'parallax', 'shadcn.luma', 'shadcn.lyra', 'shadcn.maia', 'shadcn.mira', 'shadcn.nova', 'shadcn.rhea', 'shadcn.sera', 'shadcn.vega'];
            var media = window.matchMedia('(prefers-color-scheme: dark)');
            function applyDark() {
                var theme = null;
                try { theme = localStorage.getItem('theme'); } catch (e) { }
                var dark = theme === 'dark' || (theme !== 'light' && media.matches);
                document.documentElement.classList.toggle('dark', dark);
                document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
            }
            function selectedTheme() {
                var theme = null;
                try { theme = localStorage.getItem('demo-theme'); } catch (e) { }
                if (themes.indexOf(theme) < 0) theme = 'observatory';
                return theme;
            }
            function themeHref() {
                return '/demo/tag-helpers/assets/stellar-admin.' + selectedTheme() + '.css';
            }
            window.saThemeInit = function () {
                window.saLoadThemeFonts(selectedTheme());
                var link = document.querySelector('link[data-sa-theme]');
                if (link && link.getAttribute('href') !== themeHref()) link.setAttribute('href', themeHref());
            };
            function swapTheme() {
                window.saLoadThemeFonts(selectedTheme());
                var links = document.querySelectorAll('link[data-sa-theme]');
                var current = links[links.length - 1];
                if (!current || current.getAttribute('href') === themeHref()) return;
                var next = document.createElement('link');
                next.rel = 'stylesheet';
                next.setAttribute('data-sa-theme', '');
                next.href = themeHref();
                next.addEventListener('load', function () {
                    if (!next.isConnected) return;
                    var all = document.querySelectorAll('link[data-sa-theme]');
                    for (var i = 0; i < all.length && all[i] !== next; i++) all[i].remove();
                });
                current.after(next);
            }
            applyDark();
            window.addEventListener('storage', function (e) {
                if (e.key === null || e.key === 'theme') applyDark();
                if (e.key === null || e.key === 'demo-theme') swapTheme();
            });
            media.addEventListener('change', applyDark);
        })();
    </script>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <script src="/demo/tag-helpers/assets/theme-fonts.vqsfb4uqta.js"></script>
    <link rel="stylesheet" href="/demo/tag-helpers/assets/site.48ffa2y2xh.css" />
    <link rel="stylesheet" data-sa-theme href="/demo/tag-helpers/assets/stellar-admin.observatory.css" /><script>saThemeInit();</script>
    
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s;
        }
    </style>
    

    <script defer src="/demo/tag-helpers/assets/stellar-admin.i42n1x9nlz.js"></script>
</head>
<body>
<script>
    window.addEventListener('load', function () {
        document.body.style.opacity = '1';
    });
</script>
<div class="preview flex w-full justify-center px-10 py-10">
    
    <div class="py-10 flex justify-center">
    <!-- code begin -->
    <div class="grid grid-cols-2 gap-4">
        <button class="sa-button group/button sa-button-variant-outline sa-button-size-default size-30" interestfor="--tooltip-position-top-span-right" data-slot="button">
            Top<br/>Span Right
        </button>
        <button class="sa-button group/button sa-button-variant-outline sa-button-size-default size-30" interestfor="--tooltip-position-right-center" data-slot="button">
            Right<br/>Center
        </button>
        <button class="sa-button group/button sa-button-variant-outline sa-button-size-default size-30" interestfor="--tooltip-position-left-span-top" data-slot="button">
            Left<br/>Span Top
        </button>
        <button class="sa-button group/button sa-button-variant-outline sa-button-size-default size-30" interestfor="--tooltip-position-bottom-span-left" data-slot="button">
            Bottom<br/>Span Left
        </button>
    </div>
    <div id="--tooltip-position-top-span-right" popover="hint" data-slot="tooltip-content" data-anchor-side="top" class="sa-tooltip-content anchored-top-span-right">
        Positioned at the top of the trigger and spanning to the right
    </div>
    <div id="--tooltip-position-right-center" popover="hint" data-slot="tooltip-content" data-anchor-side="right" class="sa-tooltip-content anchored-right-center">
        Positioned at the right center of the trigger
    </div>
    <div id="--tooltip-position-left-span-top" popover="hint" data-slot="tooltip-content" data-anchor-side="left" class="sa-tooltip-content anchored-left-span-top">
        Positioned at the left of the trigger and spanning to the top
    </div>
    <div id="--tooltip-position-bottom-span-left" popover="hint" data-slot="tooltip-content" data-anchor-side="bottom" class="sa-tooltip-content anchored-bottom-span-left">
        Positioned at the bottom of the trigger and spanning to the left
    </div>
    <!-- code end -->
</div>

</div>



</body>
</html>
