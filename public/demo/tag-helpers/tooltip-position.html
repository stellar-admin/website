<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (function () {
            var media = window.matchMedia('(prefers-color-scheme: dark)');
            function applyTheme() {
                var theme = null;
                try { theme = localStorage.getItem('theme'); } catch (e) { }
                var dark = theme === 'dark' || (theme !== 'light' && media.matches);
                document.documentElement.classList.toggle('dark', dark);
                document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
            }
            applyTheme();
            window.addEventListener('storage', function (e) {
                if (e.key === null || e.key === 'theme') applyTheme();
            });
            media.addEventListener('change', applyTheme);
        })();
    </script>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"/>
    <link rel="stylesheet" href="/demo/tag-helpers/assets/site.yk0a9dj22n.css" />
    <link rel="stylesheet" href="/demo/tag-helpers/assets/stellar-admin.nova.cspk3t8uwa.css" />
    
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s;
        }
    </style>

    <script defer src="/demo/tag-helpers/assets/stellar-admin.r7faauge04.js"></script>
</head>
<body>

    <div id="--tooltip-position-bottom-span-left" popover="hint" data-slot="tooltip-content" data-anchor-side="bottom" class="sa-tooltip-content anchored-bottom-span-left">
        Positioned at the bottom of the trigger and spanning to the left

    <!-- code end -->
</div>

</div>

</html>
