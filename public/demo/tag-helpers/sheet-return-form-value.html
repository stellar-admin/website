<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (function () {
            var media = window.matchMedia('(prefers-color-scheme: dark)');
            function applyTheme() {
                var theme = null;
                try { theme = localStorage.getItem('theme'); } catch (e) { }
                var dark = theme === 'dark' || (theme !== 'light' && media.matches);
                document.documentElement.classList.toggle('dark', dark);
                document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
            }
            applyTheme();
            window.addEventListener('storage', function (e) {
                if (e.key === null || e.key === 'theme') applyTheme();
            });
            media.addEventListener('change', applyTheme);
        })();
    </script>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"/>
    <link rel="stylesheet" href="/demo/tag-helpers/assets/site.yk0a9dj22n.css" />
    <link rel="stylesheet" href="/demo/tag-helpers/assets/stellar-admin.nova.cspk3t8uwa.css" />
    
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s;
        }
    </style>

    <script defer src="/demo/tag-helpers/assets/stellar-admin.r7faauge04.js"></script>
</head>
<body>
<script>
    window.addEventListener('load', function () {
        document.body.style.opacity = '1';
    });
</script>
<div class="preview flex w-full justify-center px-10 py-10">
    
    <!--strip
asp-antiforgery="false"
-->
<div class="min-h-[450px]">
    <!-- code begin -->
    <div class="sa-stack sa-stack-align-start sa-stack-gap-md sa-stack-justify-start min-w-md">
        <button commandfor="--sheet-return-form-value-sheet" command="show-modal" data-slot="button" class="sa-button group/button sa-button-variant-outline sa-button-size-default">
            Open Sheet with Form
        </button>
        <label class="text-sm font-bold">Output:</label>
        <div class="font-mono w-full h-40 overflow-y-auto bg-gray-50" id="--sheet-return-form-value-output">-</div>
    </div>
    <sel-dialog><dialog id="--sheet-return-form-value-sheet" data-slot="sheet-content" data-side="right" class="sa-sheet-content"><button class="sa-button group/button sa-button-variant-ghost sa-button-size-icon-sm sa-sheet-close" commandfor="--sheet-return-form-value-sheet" command="close" data-slot="button"></button><div class="sa-sheet-body">
        <form method="dialog" class="flex flex-col h-full gap-4" action="/DocsStatic/?name=Sheet/_ReturnFormValue&amp;layout=">
            <div data-slot="sheet-header" class="sa-sheet-header">
                <h2 data-slot="sheet-title" class="sa-sheet-title sa-font-heading font-heading">Edit profile</h2>
                <p data-slot="sheet-description" class="sa-sheet-description">Make changes to your profile here. Click save when you're done.
                </p>
            </div>
            <div class="sa-field-group group/field-group grid gap-6 px-4" data-slot="field-group">
                <div class="sa-field group/field sa-field-orientation-vertical [&amp;&gt;*]:w-full [&amp;&gt;.sr-only]:w-auto" data-orientation="vertical" data-slot="field">
                    <label for="--sheet-return-form-value-name" data-slot="label" class="sa-label">Name</label>
                    <input id="--sheet-return-form-value-name" name="name" defaultValue="Ibn Battuta" required data-slot="input" class="sa-input"></input>
                </div>
                <div class="sa-field group/field sa-field-orientation-vertical [&amp;&gt;*]:w-full [&amp;&gt;.sr-only]:w-auto" data-orientation="vertical" data-slot="field">
                    <label for="--sheet-return-form-value-username" data-slot="label" class="sa-label">Username</label>
                    <input id="--sheet-return-form-value-username" name="username" defaultValue="@ibnbattuta" required data-slot="input" class="sa-input"></input>
                </div>
            </div>
            <div data-slot="sheet-footer" class="sa-sheet-footer">
                <button type="button" commandfor="--sheet-return-form-value-sheet" command="close" data-slot="button" class="sa-button group/button sa-button-variant-outline sa-button-size-default">
                    Cancel
                </button>
                <button type="submit" value="confirm" data-slot="button" class="sa-button group/button sa-button-variant-default sa-button-size-default">
                    Save Changes
                </button>
            </div>
        </form>
    </div></dialog></sel-dialog>
    <script>
        (function() {
            const sheet = document.getElementById("--sheet-return-form-value-sheet");
            const output = document.getElementById("--sheet-return-form-value-output");

            sheet.addEventListener("close", () => {
                const cancelled = sheet.returnValue === "" || sheet.returnValue === "cancel";
                if (cancelled) {
                    output.innerHTML = "Cancelled";
                    return;
                }

                const form = sheet.querySelector("form");
                const data = Object.fromEntries(new FormData(form));
                output.innerHTML = JSON.stringify(data, null, 2);
            });
            sheet.addEventListener("toggle", (e) => {
                // Reset the return value every time the dialog opens to prevent a previous
                // returnValue from being returned when pressing the Esc key
                if (e.newState === "open") {
                    sheet.returnValue = "";
                }
            });
        })();
    </script>
    <!-- code end -->
</div>


</div>
