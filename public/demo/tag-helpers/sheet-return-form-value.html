<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (function () {
            var themes = ['luma', 'lyra', 'maia', 'mira', 'nova', 'rhea', 'sera', 'vega'];
            var media = window.matchMedia('(prefers-color-scheme: dark)');
            function applyDark() {
                var theme = null;
                try { theme = localStorage.getItem('theme'); } catch (e) { }
                var dark = theme === 'dark' || (theme !== 'light' && media.matches);
                document.documentElement.classList.toggle('dark', dark);
                document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
            }
            function themeHref() {
                var theme = null;
                try { theme = localStorage.getItem('demo-theme'); } catch (e) { }
                if (themes.indexOf(theme) < 0) theme = 'nova';
                return '/demo/tag-helpers/assets/stellar-admin.' + theme + '.css';
            }
            window.saThemeInit = function () {
                var link = document.querySelector('link[data-sa-theme]');
                if (link && link.getAttribute('href') !== themeHref()) link.setAttribute('href', themeHref());
            };
            function swapTheme() {
                var links = document.querySelectorAll('link[data-sa-theme]');
                var current = links[links.length - 1];
                if (!current || current.getAttribute('href') === themeHref()) return;
                var next = document.createElement('link');
                next.rel = 'stylesheet';
                next.setAttribute('data-sa-theme', '');
                next.href = themeHref();
                next.addEventListener('load', function () {
                    if (!next.isConnected) return;
                    var all = document.querySelectorAll('link[data-sa-theme]');
                    for (var i = 0; i < all.length && all[i] !== next; i++) all[i].remove();
                });
                current.after(next);
            }
            applyDark();
            window.addEventListener('storage', function (e) {
                if (e.key === null || e.key === 'theme') applyDark();
                if (e.key === null || e.key === 'demo-theme') swapTheme();
            });
            media.addEventListener('change', applyDark);
        })();
    </script>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"/>

    <link rel="stylesheet" data-sa-theme href="/demo/tag-helpers/assets/stellar-admin.nova.css" /><script>saThemeInit();</script>

    <script defer src="/demo/tag-helpers/assets/stellar-admin.0frsvhd7es.js"></script>
</head>

<script>

    </div>
    <sel-dialog><dialog id="--sheet-return-form-value-sheet" data-slot="sheet-content" data-side="right" class="sa-sheet-content"><button type="button" class="sa-button group/button sa-button-variant-ghost sa-button-size-icon-sm sa-sheet-close" commandfor="--sheet-return-form-value-sheet" command="close" data-slot="button"><svg class="size-4" stroke="currentColor" xmlns="http://www.w3.org/2000/svg" height="24" stroke-linecap="round" width="24" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" fill="none"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg><span class="sr-only">Close</span></button><div class="sa-sheet-body">
        <form method="dialog" class="flex flex-col h-full gap-4" action="/DocsStatic/?name=Sheet/_ReturnFormValue&amp;layout=">
            <div data-slot="sheet-header" class="sa-sheet-header">
                <h2 data-slot="sheet-title" class="sa-sheet-title sa-font-heading font-heading">Edit traveller</h2>
                <p data-slot="sheet-description" class="sa-sheet-description">Update the traveller's details here. Click save when you're done.
                </p>
            </div>
            <div class="sa-field-group group/field-group grid gap-6 px-4" data-slot="field-group">
                <div class="sa-field group/field sa-field-orientation-vertical [&amp;&gt;*]:w-full [&amp;&gt;.sr-only]:w-auto" data-orientation="vertical" data-slot="field">
                    <label for="--sheet-return-form-value-name" data-slot="label" class="sa-label">Name</label>
                    <input id="--sheet-return-form-value-name" name="name" value="Ibn Battuta" required data-slot="input" class="sa-input">

                    <label for="--sheet-return-form-value-username" data-slot="label" class="sa-label">Username</label>
                    <input id="--sheet-return-form-value-username" name="username" value="@ibnbattuta" required data-slot="input" class="sa-input">
                </div>
            </div>

                <button type="button" commandfor="--sheet-return-form-value-sheet" command="close" data-slot="button" class="sa-button group/button sa-button-variant-outline sa-button-size-default">

    <script>
        (function() {
            const sheet = document.getElementById("--sheet-return-form-value-sheet");
            const output = document.getElementById("--sheet-return-form-value-output");

            sheet.addEventListener("close", () => {
                const cancelled = sheet.returnValue === "" || sheet.returnValue === "cancel";
                if (cancelled) {
                    output.innerHTML = "Cancelled";
                    return;
                }

                const form = sheet.querySelector("form");
                const data = Object.fromEntries(new FormData(form));
                output.innerHTML = JSON.stringify(data, null, 2);
            });
            sheet.addEventListener("toggle", (e) => {
                // Reset the return value every time the dialog opens to prevent a previous
                // returnValue from being returned when pressing the Esc key
                if (e.newState === "open") {
                    sheet.returnValue = "";
                }
            });
        })();
    </script>
