<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"/>
    <link rel="stylesheet" href="/demo/tag-helpers/assets/site.yk0a9dj22n.css" />
    <link rel="stylesheet" href="/demo/tag-helpers/assets/stellar-admin.nova.cspk3t8uwa.css" />
    
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s;
        }
    </style>

    <script defer src="/demo/tag-helpers/assets/stellar-admin.r7faauge04.js"></script>
</head>
<body>
<script>
    window.addEventListener('load', function () {
        document.body.style.opacity = '1';
    });
</script>
<div class="preview flex w-full justify-center px-10 py-10">
    
    <div class="min-h-[330px]">
    <!-- code begin -->
    <div class="sa-stack sa-stack-align-center sa-stack-gap-sm sa-stack-justify-start">
        
            <button type="button" data-slot="dropdown-menu-trigger" aria-haspopup="menu" popovertarget="--sa-dropdown-menu-aa067686dd84560138990fab038c40c5d7c75ac7ccd848209c824728e5e81bfb7633" class="sa-button group/button sa-button-variant-outline sa-button-size-default">
                <svg class="text-muted-foreground" fill="none" stroke-linejoin="round" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg" height="24" stroke-width="2" viewBox="0 0 24 24" width="24" stroke="currentColor"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>
                Trip Actions
            </button>
            <sel-dropdown-menu class="sa-dropdown-menu-content sa-dropdown-menu-content-logical dark anchored-bottom-span-right w-56" id="--sa-dropdown-menu-aa067686dd84560138990fab038c40c5d7c75ac7ccd848209c824728e5e81bfb7633" popover="" role="menu" data-slot="dropdown-menu-content" data-anchor-side="bottom" data-side="bottom">
                <div data-slot="dropdown-menu-label" class="sa-dropdown-menu-label">Trip #TRV-987</div>
                <div role="separator" aria-orientation="horizontal" data-slot="dropdown-menu-separator" class="sa-dropdown-menu-separator"></div>
                <!-- A non-link item receives click events on any element: here via an inline onclick -->
                <div onclick="voyagerTripAction('Trip link copied to clipboard')" role="menuitem" tabindex="-1" data-slot="dropdown-menu-item" data-variant="default" class="sa-dropdown-menu-item group/dropdown-menu-item">
                    <svg fill="none" stroke-linejoin="round" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg" height="24" stroke-width="2" viewBox="0 0 24 24" width="24" stroke="currentColor"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
                    Copy Trip Link
                </div>
                <!-- ...or wired up in script with addEventListener (see below) -->
                <div id="--duplicate-trip-item" role="menuitem" tabindex="-1" data-slot="dropdown-menu-item" data-variant="default" class="sa-dropdown-menu-item group/dropdown-menu-item">
                    <svg fill="none" stroke-linejoin="round" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg" height="24" stroke-width="2" viewBox="0 0 24 24" width="24" stroke="currentColor"><rect height="14" rx="2" ry="2" width="14" x="8" y="8"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg>
                    Duplicate Trip
                </div>
                <div id="--print-itinerary-item" role="menuitem" tabindex="-1" data-slot="dropdown-menu-item" data-variant="default" class="sa-dropdown-menu-item group/dropdown-menu-item">
                    <svg fill="none" stroke-linejoin="round" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg" height="24" stroke-width="2" viewBox="0 0 24 24" width="24" stroke="currentColor"><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6"></path><rect height="8" rx="1" width="12" x="6" y="14"></rect></svg>
                    Print Itinerary
                </div>
            </sel-dropdown-menu>
        
        <p class="text-muted-foreground text-sm" id="--trip-action-output">
            Choose an action from the menu.
        </p>
    </div>
    <script>
        // The sel-dropdown-menu web component dispatches a real click on the focused item for
        // both mouse clicks and keyboard activation (Enter / Space), so a plain click listener
        // works for either. The menu closes on select after your handler runs.
        function voyagerTripAction(message) {
            document.getElementById('--trip-action-output').textContent = message;
        }

        document
            .getElementById('--duplicate-trip-item')
            .addEventListener('click', () => voyagerTripAction('Trip duplicated'));
        document
            .getElementById('--print-itinerary-item')
            .addEventListener('click', () => voyagerTripAction('Sending itinerary to the printer…'));
    </script>
    <!-- code end -->
</div>


</div>



</body>
</html>
