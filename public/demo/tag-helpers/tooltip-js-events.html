<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300..700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" />
    <script>
        (function () {
            var themes = ['aurora', 'concourse', 'ice', 'ledger', 'luma', 'lyra', 'maia', 'meridian', 'mira', 'nova', 'observatory', 'rhea', 'sera', 'vega'];
            var media = window.matchMedia('(prefers-color-scheme: dark)');
            function applyDark() {
                var theme = null;
                try { theme = localStorage.getItem('theme'); } catch (e) { }
                var dark = theme === 'dark' || (theme !== 'light' && media.matches);
                document.documentElement.classList.toggle('dark', dark);
                document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
            }
            function themeHref() {
                var theme = null;
                try { theme = localStorage.getItem('demo-theme'); } catch (e) { }
                if (themes.indexOf(theme) < 0) theme = 'nova';
                return '/demo/tag-helpers/assets/stellar-admin.' + theme + '.css';
            }
            window.saThemeInit = function () {
                var link = document.querySelector('link[data-sa-theme]');
                if (link && link.getAttribute('href') !== themeHref()) link.setAttribute('href', themeHref());
            };
            function swapTheme() {
                var links = document.querySelectorAll('link[data-sa-theme]');
                var current = links[links.length - 1];
                if (!current || current.getAttribute('href') === themeHref()) return;
                var next = document.createElement('link');
                next.rel = 'stylesheet';
                next.setAttribute('data-sa-theme', '');
                next.href = themeHref();
                next.addEventListener('load', function () {
                    if (!next.isConnected) return;
                    var all = document.querySelectorAll('link[data-sa-theme]');
                    for (var i = 0; i < all.length && all[i] !== next; i++) all[i].remove();
                });
                current.after(next);
            }
            applyDark();
            window.addEventListener('storage', function (e) {
                if (e.key === null || e.key === 'theme') applyDark();
                if (e.key === null || e.key === 'demo-theme') swapTheme();
            });
            media.addEventListener('change', applyDark);
        })();
    </script>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300..700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@600&amp;family=Work+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap"/>
    <link rel="stylesheet" href="/demo/tag-helpers/assets/site.opsthpdi9s.css" />
    <link rel="stylesheet" data-sa-theme href="/demo/tag-helpers/assets/stellar-admin.ledger.css" /><script>saThemeInit();</script>
    
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s;
        }
    </style>
    

    <script defer src="/demo/tag-helpers/assets/stellar-admin.i42n1x9nlz.js"></script>
</head>
<body>
<script>
    window.addEventListener('load', function () {
        document.body.style.opacity = '1';
    });
</script>
<div class="preview flex w-full justify-center px-10 py-10">
    
    <div class="py-2">
    <!-- code begin -->
    <div class="sa-stack sa-stack-align-stretch sa-stack-gap-sm sa-stack-justify-start">
        <button interestfor="--tooltip-js-events" aria-label="Show tooltip" data-slot="button" class="sa-button group/button sa-button-variant-outline sa-button-size-icon-sm">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" fill="none" viewBox="0 0 24 24" stroke-linejoin="round" height="24" stroke-width="2" stroke-linecap="round" stroke="currentColor"><path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5c0 1.1.9 2 2 2h1"></path><path d="M16 21h1a2 2 0 0 0 2-2v-5c0-1.1.9-2 2-2a2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1"></path></svg>
        </button>
        <label class="text-sm font-bold">Events:</label>
        <div class="font-mono w-100 h-40 overflow-y-auto rounded-md border border-border bg-muted p-3 text-foreground" id="--tooltip-js-events-output">
        </div>
    </div>
    <div id="--tooltip-js-events" popover="hint" data-slot="tooltip-content" data-anchor-side="top" class="sa-tooltip-content anchored-top">
        This tooltip emits JS events when it opens and closes
    </div>
    <script>
        let counter = 0;
        const eventsTooltip = document.getElementById('--tooltip-js-events');
        const eventsTooltipEventOutput = document.getElementById('--tooltip-js-events-output');

        eventsTooltip.addEventListener("interest", (e) => {
            eventsTooltipEventOutput.innerText = `${++counter}: Tooltip opened\n` + eventsTooltipEventOutput.innerText;
        });
        eventsTooltip.addEventListener("loseinterest", (e) => {
            eventsTooltipEventOutput.innerText = `${++counter}: Tooltip closed\n` + eventsTooltipEventOutput.innerText;
        });
    </script>
    <!-- code end -->
</div>


</div>



</body>
</html>
