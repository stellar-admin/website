<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"/>
    <link rel="stylesheet" href="/demo/tag-helpers/assets/site.yk0a9dj22n.css" />
    <link rel="stylesheet" href="/demo/tag-helpers/assets/stellar-admin.nova.cspk3t8uwa.css" />
    
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s;
        }
    </style>

    <script defer src="/demo/tag-helpers/assets/stellar-admin.r7faauge04.js"></script>
</head>
<body>
<script>
    window.addEventListener('load', function () {
        document.body.style.opacity = '1';
    });
</script>
<div class="preview flex w-full justify-center px-10 py-10">
    
    <div class="py-2">
    <!-- code begin -->
    <div class="sa-stack sa-stack-align-stretch sa-stack-gap-sm sa-stack-justify-start">
        <button interestfor="--tooltip-js-events" data-slot="button" class="sa-button group/button sa-button-variant-outline sa-button-size-icon-sm">
            <svg fill="none" stroke-linejoin="round" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg" height="24" stroke-width="2" viewBox="0 0 24 24" width="24" stroke="currentColor"><path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5c0 1.1.9 2 2 2h1"></path><path d="M16 21h1a2 2 0 0 0 2-2v-5c0-1.1.9-2 2-2a2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1"></path></svg>
        </button>
        <label class="text-sm font-bold">Events:</label>
        <div class="font-mono w-100 h-40 overflow-y-auto bg-gray-50" id="--tooltip-js-events-output">
        </div>
    </div>
    <div id="--tooltip-js-events" popover="hint" data-slot="tooltip-content" data-anchor-side="top" class="sa-tooltip-content anchored-top">
        This tooltip emits JS events when it opens and closes
    </div>
    <script>
        let counter = 0;
        const eventsTooltip = document.getElementById('--tooltip-js-events');
        const eventsTooltipEventOutput = document.getElementById('--tooltip-js-events-output');

        eventsTooltip.addEventListener("interest", (e) => {
            eventsTooltipEventOutput.innerText = `${++counter}: Tooltip opened\n` + eventsTooltipEventOutput.innerText;
        });
        eventsTooltip.addEventListener("loseinterest", (e) => {
            eventsTooltipEventOutput.innerText = `${++counter}: Tooltip closed\n` + eventsTooltipEventOutput.innerText;
        });
    </script>
    <!-- code end -->
</div>


</div>



</body>
</html>
