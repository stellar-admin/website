<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (function () {
            var themes = ['default', 'ledger', 'ops', 'soft'];
            var media = window.matchMedia('(prefers-color-scheme: dark)');
            function applyDark() {
                var theme = null;
                try { theme = localStorage.getItem('theme'); } catch (e) { }
                var dark = theme === 'dark' || (theme !== 'light' && media.matches);
                document.documentElement.classList.toggle('dark', dark);
                document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
            }
            function selectedTheme() {
                var theme = null;
                try { theme = localStorage.getItem('demo-theme'); } catch (e) { }
                if (themes.indexOf(theme) < 0) theme = 'default';
                return theme;
            }
            function presetHref() {
                var theme = selectedTheme();
                return theme === 'default' ? null : '/demo/tag-helpers/assets/presets/' + theme + '.css';
            }
            window.saThemeInit = function () {
                window.saLoadThemeFonts(selectedTheme());
                var link = document.querySelector('link[data-sa-theme]');
                var href = presetHref();
                if (link && href) link.setAttribute('href', href);
            };
            function swapTheme() {
                window.saLoadThemeFonts(selectedTheme());
                var links = document.querySelectorAll('link[data-sa-theme]');
                var current = links[links.length - 1];
                var href = presetHref();
                if (!current || current.getAttribute('href') === href) return;
                for (var i = 0; i < links.length - 1; i++) links[i].remove();
                if (!href || !current.getAttribute('href')) {
                    if (href) current.setAttribute('href', href);
                    else current.removeAttribute('href');
                    return;
                }
                var next = document.createElement('link');
                next.rel = 'stylesheet';
                next.setAttribute('data-sa-theme', '');
                next.href = href;
                next.addEventListener('load', function () {
                    if (!next.isConnected) return;
                    var all = document.querySelectorAll('link[data-sa-theme]');
                    for (var i = 0; i < all.length && all[i] !== next; i++) all[i].remove();
                });
                current.after(next);
            }
            applyDark();
            window.addEventListener('storage', function (e) {
                if (e.key === null || e.key === 'theme') applyDark();
                if (e.key === null || e.key === 'demo-theme') swapTheme();
            });
            media.addEventListener('change', applyDark);
        })();
    </script>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <script>window.saThemeFonts = {"default":"Inter:wght@400..700","ledger":"Lexend:wght@300..700","ops":"IBM\u002BPlex\u002BSans:wght@400;500;600;700","soft":"Figtree:wght@400..700"};</script>
    <script src="/demo/tag-helpers/assets/theme-fonts.qm7amh8j3s.js"></script>
    <link rel="stylesheet" href="/demo/tag-helpers/assets/site.urffqt6gbo.css" />
    <link rel="stylesheet" href="/demo/tag-helpers/assets/stellar-admin.8xkpvcneaa.css" />
        <link rel="stylesheet" data-sa-theme /><script>saThemeInit();</script>
    
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s;
        }
    </style>
    

    <script defer src="/demo/tag-helpers/assets/stellar-admin.l1lekyp2hh.js"></script>
</head>
<body>
<script>
    window.addEventListener('load', function () {
        document.body.style.opacity = '1';
    });
</script>
<div class="preview flex w-full justify-center px-10 py-10">
    
    <div class="py-2">
    <!-- code begin -->
    <div class="sa-stack sa-stack-align-stretch sa-stack-gap-sm sa-stack-justify-start">
        <button interestfor="--tooltip-js-events" aria-label="Show tooltip" data-slot="button" class="sa-button sa-button-variant-outline sa-button-size-icon-sm">
            <svg width="24" height="24" stroke-linejoin="round" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg"><path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5c0 1.1.9 2 2 2h1"></path><path d="M16 21h1a2 2 0 0 0 2-2v-5c0-1.1.9-2 2-2a2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1"></path></svg>
        </button>
        <label class="text-sm font-bold">Events:</label>
        <div class="font-mono w-100 h-40 overflow-y-auto rounded-md border border-border bg-muted p-3 text-foreground" id="--tooltip-js-events-output">
        </div>
    </div>
    <div id="--tooltip-js-events" popover="hint" data-slot="tooltip-content" data-anchor-side="top" class="sa-tooltip-content anchored-top">
        This tooltip emits JS events when it opens and closes
    </div>
    <script>
        let counter = 0;
        const eventsTooltip = document.getElementById('--tooltip-js-events');
        const eventsTooltipEventOutput = document.getElementById('--tooltip-js-events-output');

        eventsTooltip.addEventListener("interest", (e) => {
            eventsTooltipEventOutput.innerText = `${++counter}: Tooltip opened\n` + eventsTooltipEventOutput.innerText;
        });
        eventsTooltip.addEventListener("loseinterest", (e) => {
            eventsTooltipEventOutput.innerText = `${++counter}: Tooltip closed\n` + eventsTooltipEventOutput.innerText;
        });
    </script>
    <!-- code end -->
</div>


</div>



</body>
</html>
