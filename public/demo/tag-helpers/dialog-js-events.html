<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"/>
    <link rel="stylesheet" href="/demo/tag-helpers/assets/site.yk0a9dj22n.css" />
    <link rel="stylesheet" href="/demo/tag-helpers/assets/stellar-admin.nova.cspk3t8uwa.css" />
    
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s;
        }
    </style>

    <script defer src="/demo/tag-helpers/assets/stellar-admin.r7faauge04.js"></script>
</head>
<body>
<script>
    window.addEventListener('load', function () {
        document.body.style.opacity = '1';
    });
</script>
<div class="preview flex w-full justify-center px-10 py-10">
    
    <div class="min-h-[450px]">
    <!-- code begin -->
    <div class="sa-stack sa-stack-align-start sa-stack-gap-sm sa-stack-justify-start min-w-md">
        <button commandfor="--dialog-js-events-dialog" command="show-modal" data-slot="button" class="sa-button group/button sa-button-variant-outline sa-button-size-default">
            Open Dialog
        </button>
        <div class="sa-field group/field sa-field-orientation-horizontal" data-orientation="horizontal" data-slot="field"><span class="sa-input-control-wrapper"><input type="checkbox" id="--dialog-js-events-prevent-toggle-checkbox" data-slot="input" class="sa-checkbox peer"></input><span class="sa-checkbox-indicator"><svg class="sa-checkbox-indicator-icon" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg" stroke-linejoin="round" viewBox="0 0 24 24" stroke="currentColor" fill="none" height="24" width="24" stroke-width="2"><path d="M20 6 9 17l-5-5"></path></svg></span></span><div data-slot="field-content" class="sa-field-content group/field-content"><label data-slot="field-label" class="sa-label sa-field-label group/field-label peer/field-label">PreventDefault() in beforetoggle event</label><p data-slot="field-description" class="sa-field-description">Will prevent the dialog from opening</p></div></div>
        <label class="text-sm font-bold">Events:</label>
        <div class="font-mono w-full h-40 overflow-y-auto bg-gray-50" id="--dialog-js-events-output">
        </div>
    </div>
    <sel-dialog><dialog id="--dialog-js-events-dialog" data-slot="dialog-content" class="sa-dialog-content">
        <div data-slot="dialog-header" class="sa-dialog-header">
            <h2 data-slot="dialog-title" class="sa-dialog-title sa-font-heading font-heading">Events</h2>
        </div>
        <p>This dialog is used to demonstrates events.</p>
        <div class="sa-field group/field sa-field-orientation-horizontal" data-orientation="horizontal" data-slot="field"><span class="sa-input-control-wrapper"><input type="checkbox" id="--dialog-js-events-prevent-cancel-checkbox" data-slot="input" class="sa-checkbox peer"></input><span class="sa-checkbox-indicator"><svg class="sa-checkbox-indicator-icon" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg" stroke-linejoin="round" viewBox="0 0 24 24" stroke="currentColor" fill="none" height="24" width="24" stroke-width="2"><path d="M20 6 9 17l-5-5"></path></svg></span></span><div data-slot="field-content" class="sa-field-content group/field-content"><label data-slot="field-label" class="sa-label sa-field-label group/field-label peer/field-label">PreventDefault() in cancel event</label><p data-slot="field-description" class="sa-field-description">Will prevent the Request Close button from closing the dialog</p></div></div>
        <div data-slot="dialog-footer" class="sa-dialog-footer">
            <button commandfor="--dialog-js-events-dialog" command="close" data-slot="button" class="sa-button group/button sa-button-variant-outline sa-button-size-default">
                Close
            </button>
            <button commandfor="--dialog-js-events-dialog" command="request-close" data-slot="button" class="sa-button group/button sa-button-variant-outline sa-button-size-default">
                Request Close
            </button>
        </div>
    </dialog></sel-dialog>
    <script>
        (function () {
            let counter = 0;
            const dialog = document.getElementById('--dialog-js-events-dialog');
            const output = document.getElementById('--dialog-js-events-output');
            const preventToggleCheckbox = document.getElementById('--dialog-js-events-prevent-toggle-checkbox');
            const preventCancelCheckbox = document.getElementById('--dialog-js-events-prevent-cancel-checkbox');

            dialog.addEventListener("beforetoggle", (e) => {
                if (preventToggleCheckbox.checked === true) {
                    output.innerText = `${++counter}: beforetoggle event prevented!\n` + output.innerText;
                    e.preventDefault();
                    return;
                }
                output.innerText = `${++counter}: beforetoggle event: ${e.oldState} -> ${e.newState}\n` + output.innerText;
            });
            dialog.addEventListener("toggle", (e) => {
                output.innerText = `${++counter}: toggle event: ${e.oldState} -> ${e.newState}\n` + output.innerText;
            });
            dialog.addEventListener("cancel", (e) => {
                if (preventCancelCheckbox.checked === true) {
                    output.innerText = `${++counter}: cancel event prevented!\n` + output.innerText;
                    e.preventDefault();
                    return;
                }
                output.innerText = `${++counter}: cancel event\n` + output.innerText;
            });
            dialog.addEventListener("close", (e) => {
                output.innerText = `${++counter}: close event\n` + output.innerText;
            });
        })();
    </script>
    <!-- code end -->
</div>


</div>



</body>
</html>
