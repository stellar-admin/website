<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (function () {
            var media = window.matchMedia('(prefers-color-scheme: dark)');
            function applyTheme() {
                var theme = null;
                try { theme = localStorage.getItem('theme'); } catch (e) { }
                var dark = theme === 'dark' || (theme !== 'light' && media.matches);
                document.documentElement.classList.toggle('dark', dark);
                document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
            }
            applyTheme();
            window.addEventListener('storage', function (e) {
                if (e.key === null || e.key === 'theme') applyTheme();
            });
            media.addEventListener('change', applyTheme);
        })();
    </script>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>

</head>

            Show

    <sel-dialog><dialog id="--dialog-open-via-js-dialog" data-slot="dialog-content" class="sa-dialog-content">
        This is the dialog content...
        <div data-slot="dialog-footer" class="sa-dialog-footer">
            <button id="--dialog-open-via-js-close-button" data-slot="button" class="sa-button group/button sa-button-variant-outline sa-button-size-default">
                Close via JS
            </button>
        </div>
    </dialog></sel-dialog>
    <script>
        (function() {
            const dialog = document.getElementById("--dialog-open-via-js-dialog");
            const showModalButton = document.getElementById("--dialog-open-via-js-show-modal-button");
            const showButton = document.getElementById("--dialog-open-via-js-show-button");
            const closeButton = document.getElementById("--dialog-open-via-js-close-button");

            showModalButton.addEventListener("click", () => {
                dialog.showModal();
            });

            showButton.addEventListener("click", () => {
                dialog.show();
            });

            closeButton.addEventListener("click", () => {
                dialog.close();
            });
        })();
    </script>
    <!-- code end -->
</div>


</div>
