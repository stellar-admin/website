<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"/>
    <link rel="stylesheet" href="/demo/tag-helpers/assets/site.yk0a9dj22n.css" />
    <link rel="stylesheet" href="/demo/tag-helpers/assets/stellar-admin.nova.cspk3t8uwa.css" />
    
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s;
        }
    </style>

    <script defer src="/demo/tag-helpers/assets/stellar-admin.r7faauge04.js"></script>
</head>
<body>
<script>
    window.addEventListener('load', function () {
        document.body.style.opacity = '1';
    });
</script>
<div class="preview flex w-full justify-center px-10 py-10">
    
    <div class="w-full max-w-md">
    <!-- code begin -->
    <fieldset data-slot="field-set" class="sa-field-set">
        <legend data-slot="field-legend" data-variant="legend" class="sa-field-legend">Payment Method</legend>
        <p data-slot="field-description" class="sa-field-description">
            All transactions are secure and encrypted
        </p>
        <div data-slot="field-group" class="sa-field-group group/field-group">
            <div class="sa-field group/field sa-field-orientation-vertical [&amp;&gt;*]:w-full [&amp;&gt;.sr-only]:w-auto" data-orientation="vertical" data-slot="field">
                <label for="card-name" data-slot="field-label" class="sa-label sa-field-label group/field-label peer/field-label">
                    Name on Card
                </label>
                <input id="card-name" placeholder="Ibn Battuta" data-slot="input" class="sa-input"></input>
            </div>
            <div class="sa-field group/field sa-field-orientation-vertical [&amp;&gt;*]:w-full [&amp;&gt;.sr-only]:w-auto" data-orientation="vertical" data-slot="field">
                <label for="card-number" data-slot="field-label" class="sa-label sa-field-label group/field-label peer/field-label">
                    Card Number
                </label>
                <input id="card-number" placeholder="1234 5678 9012 3456" data-slot="input" class="sa-input"></input>
                <p data-slot="field-description" class="sa-field-description">
                    Enter your 16-digit card number
                </p>
            </div>
        </div>
    </fieldset>
    <!-- code end -->
</div>

</div>



</body>
</html>
