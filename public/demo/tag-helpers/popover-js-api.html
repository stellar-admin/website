<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="/demo/tag-helpers/assets/site.fgdwwbnywi.css" />
    <link rel="stylesheet" href="/demo/tag-helpers/assets/dune-ui.x6nkgovm1b.css" />
    
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s;
        }
    </style>

    <script defer src="/demo/tag-helpers/assets/dune-ui.edbu3mkpc0.js"></script>
</head>
<body>
<script>
    window.addEventListener('load', function () {
        document.body.style.opacity = '1';
    });
</script>
<div class="preview flex w-full justify-center px-10 py-10">
    
    <div class="min-h-[150px]">
    <!-- code begin -->
    <div class="flex flex-col items-center gap-y-4 justify-start">
        <div class="flex flex-row items-start gap-x-6 justify-start">

                Open
            </button>
            <button id="--popover-js-api-button-close" data-slot="button" class="focus-visible:border-ring focus-visible:ring-ring/50 aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive dark:aria-invalid:border-destructive/50 rounded-lg border bg-clip-padding text-sm font-medium focus-visible:ring-3 active:not-aria-[haspopup]:translate-y-px [&amp;_svg:not([class*=&#x27;size-&#x27;])]:size-4 [&amp;.input-validation-error]:ring-destructive/20 dark:[&amp;.input-validation-error]:ring-destructive/40 [&amp;.input-validation-error]:border-destructive dark:[&amp;.input-validation-error]:border-destructive/50 inline-flex items-center justify-center whitespace-nowrap transition-all disabled:pointer-events-none disabled:opacity-50 [&amp;_svg]:pointer-events-none shrink-0 [&amp;_svg]:shrink-0 outline-none group/button select-none border-border bg-background hover:bg-muted hover:text-foreground dark:bg-input/30 dark:border-input dark:hover:bg-input/50 aria-expanded:bg-muted aria-expanded:text-foreground h-8 gap-1.5 px-2.5 has-data-[icon=inline-end]:pr-2 has-data-[icon=inline-start]:pl-2">
                Close
            </button>
            <button id="--popover-js-api-button-toggle" data-slot="button" class="focus-visible:border-ring focus-visible:ring-ring/50 aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive dark:aria-invalid:border-destructive/50 rounded-lg border bg-clip-padding text-sm font-medium focus-visible:ring-3 active:not-aria-[haspopup]:translate-y-px [&amp;_svg:not([class*=&#x27;size-&#x27;])]:size-4 [&amp;.input-validation-error]:ring-destructive/20 dark:[&amp;.input-validation-error]:ring-destructive/40 [&amp;.input-validation-error]:border-destructive dark:[&amp;.input-validation-error]:border-destructive/50 inline-flex items-center justify-center whitespace-nowrap transition-all disabled:pointer-events-none disabled:opacity-50 [&amp;_svg]:pointer-events-none shrink-0 [&amp;_svg]:shrink-0 outline-none group/button select-none border-border bg-background hover:bg-muted hover:text-foreground dark:bg-input/30 dark:border-input dark:hover:bg-input/50 aria-expanded:bg-muted aria-expanded:text-foreground h-8 gap-1.5 px-2.5 has-data-[icon=inline-end]:pr-2 has-data-[icon=inline-start]:pl-2">
                Toggle
            </button>
        </div>
        <span id="--popover-js-api-avatar" data-slot="avatar" data-size="default" class="size-8 rounded-full after:rounded-full data-[size=lg]:size-10 data-[size=sm]:size-6 after:border-border group/avatar relative flex shrink-0 select-none after:absolute after:inset-0 after:border after:mix-blend-darken dark:after:mix-blend-lighten"><img alt="" class="rounded-full aspect-square size-full object-cover" data-slot="avatar-image" src="/demo/tag-helpers/assets/avatar-1.jpg"></img></span>
    </div>
    <div id="--popover-js-api" popover="manual" data-slot="popover-content" class="bg-popover text-popover-foreground ring-foreground/10 gap-2.5 rounded-lg p-2.5 text-sm shadow-md ring-1 w-72 outline-hidden try-flip-all anchored-bottom mt-2 duration-200 ease-in opacity-100 not-open:opacity-0 starting:open:opacity-0 [transition-property:opacity,display,overlay] [transition-behavior:allow-discrete]">
        <div class="flex flex-col items-stretch gap-y-4 justify-start">
            <div class="bg-muted rounded-md animate-pulse h-4 w-[250px]" data-slot="skeleton"></div>
            <div class="bg-muted rounded-md animate-pulse h-4 w-[250px]" data-slot="skeleton"></div>
        </div>
    </div>
    <script>
        const apiPopover = document.getElementById('--popover-js-api');
        const apiPopoverAvatar = document.getElementById('--popover-js-api-avatar');
        const apiPopoverButtonOpen = document.getElementById('--popover-js-api-button-open');
        const apiPopoverButtonClose = document.getElementById('--popover-js-api-button-close');
        const apiTooltipButtonToggle = document.getElementById('--popover-js-api-button-toggle');

        apiPopoverButtonOpen.addEventListener('click', () => {
            apiPopover.showPopover({
                source: apiPopoverAvatar
            });
        });
        apiPopoverButtonClose.addEventListener('click', () => {
            apiPopover.hidePopover();
        });
        apiTooltipButtonToggle.addEventListener('click', () => {
            apiPopover.togglePopover({
                source: apiPopoverAvatar
            });
        });
    </script>
    <!-- code end -->
</div>

</div>



</body>
</html>
