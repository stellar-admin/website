<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (function () {
            var media = window.matchMedia('(prefers-color-scheme: dark)');
            function applyTheme() {
                var theme = null;
                try { theme = localStorage.getItem('theme'); } catch (e) { }
                var dark = theme === 'dark' || (theme !== 'light' && media.matches);
                document.documentElement.classList.toggle('dark', dark);
                document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
            }
            applyTheme();
            window.addEventListener('storage', function (e) {
                if (e.key === null || e.key === 'theme') applyTheme();
            });
            media.addEventListener('change', applyTheme);
        })();
    </script>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"/>
    <link rel="stylesheet" href="/demo/tag-helpers/assets/site.yk0a9dj22n.css" />
    <link rel="stylesheet" href="/demo/tag-helpers/assets/stellar-admin.nova.cspk3t8uwa.css" />
    
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s;
        }
    </style>

    <script defer src="/demo/tag-helpers/assets/stellar-admin.r7faauge04.js"></script>
</head>
<body>
<script>
    window.addEventListener('load', function () {
        document.body.style.opacity = '1';
    });
</script>
<div class="preview flex w-full justify-center px-10 py-10">
    
    <div class="min-h-[150px]">
    <!-- code begin -->
    <div class="sa-stack sa-stack-align-center sa-stack-gap-md sa-stack-justify-start">
        <div class="sa-group sa-group-align-start sa-group-gap-md sa-group-justify-start">
            <button id="--popover-js-api-button-open" data-slot="button" class="sa-button group/button sa-button-variant-outline sa-button-size-default">
                Open
            </button>
            <button id="--popover-js-api-button-close" data-slot="button" class="sa-button group/button sa-button-variant-outline sa-button-size-default">
                Close
            </button>
            <button id="--popover-js-api-button-toggle" data-slot="button" class="sa-button group/button sa-button-variant-outline sa-button-size-default">
                Toggle
            </button>
        </div>
        <span id="--popover-js-api-avatar" data-slot="avatar" data-size="default" class="sa-avatar group/avatar"><img alt="" class="sa-avatar-image" data-slot="avatar-image" src="/demo/tag-helpers/assets/avatar-1.jpg"></img></span>
    </div>
    <div id="--popover-js-api" popover="manual" data-slot="popover-content" data-anchor-side="bottom" class="sa-popover-content anchored-bottom">
        <div class="sa-stack sa-stack-align-stretch sa-stack-gap-md sa-stack-justify-start">
            <div class="sa-skeleton h-4 w-[250px]" data-slot="skeleton"></div>
            <div class="sa-skeleton h-4 w-[250px]" data-slot="skeleton"></div>
        </div>
    </div>
    <script>
        const apiPopover = document.getElementById('--popover-js-api');
        const apiPopoverAvatar = document.getElementById('--popover-js-api-avatar');
        const apiPopoverButtonOpen = document.getElementById('--popover-js-api-button-open');
        const apiPopoverButtonClose = document.getElementById('--popover-js-api-button-close');
        const apiTooltipButtonToggle = document.getElementById('--popover-js-api-button-toggle');

        apiPopoverButtonOpen.addEventListener('click', () => {
            apiPopover.showPopover({
                source: apiPopoverAvatar
            });
        });
        apiPopoverButtonClose.addEventListener('click', () => {
            apiPopover.hidePopover();
        });
        apiTooltipButtonToggle.addEventListener('click', () => {
            apiPopover.togglePopover({
                source: apiPopoverAvatar
            });
        });
    </script>
    <!-- code end -->
</div>

</div>



</body>
</html>
