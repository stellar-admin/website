<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (function () {
            var themes = ['default', 'ledger', 'ops', 'soft'];
            var media = window.matchMedia('(prefers-color-scheme: dark)');
            function applyDark() {
                var theme = null;
                try { theme = localStorage.getItem('theme'); } catch (e) { }
                var dark = theme === 'dark' || (theme !== 'light' && media.matches);
                document.documentElement.classList.toggle('dark', dark);
                document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
            }
            function selectedTheme() {
                var theme = null;
                try { theme = localStorage.getItem('demo-theme'); } catch (e) { }
                if (themes.indexOf(theme) < 0) theme = 'default';
                return theme;
            }
            function presetHref() {
                var theme = selectedTheme();
                return theme === 'default' ? null : '/demo/tag-helpers/assets/presets/' + theme + '.css';
            }
            window.saThemeInit = function () {
                window.saLoadThemeFonts(selectedTheme());
                var link = document.querySelector('link[data-sa-theme]');
                var href = presetHref();
                if (link && href) link.setAttribute('href', href);
            };
            function swapTheme() {
                window.saLoadThemeFonts(selectedTheme());
                var links = document.querySelectorAll('link[data-sa-theme]');
                var current = links[links.length - 1];
                var href = presetHref();
                if (!current || current.getAttribute('href') === href) return;
                for (var i = 0; i < links.length - 1; i++) links[i].remove();
                if (!href || !current.getAttribute('href')) {
                    if (href) current.setAttribute('href', href);
                    else current.removeAttribute('href');
                    return;
                }
                var next = document.createElement('link');
                next.rel = 'stylesheet';
                next.setAttribute('data-sa-theme', '');
                next.href = href;
                next.addEventListener('load', function () {
                    if (!next.isConnected) return;
                    var all = document.querySelectorAll('link[data-sa-theme]');
                    for (var i = 0; i < all.length && all[i] !== next; i++) all[i].remove();
                });
                current.after(next);
            }
            applyDark();
            window.addEventListener('storage', function (e) {
                if (e.key === null || e.key === 'theme') applyDark();
                if (e.key === null || e.key === 'demo-theme') swapTheme();
            });
            media.addEventListener('change', applyDark);
        })();
    </script>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <script src="/demo/tag-helpers/assets/theme-fonts.6yf6e5pk5o.js"></script>
    <link rel="stylesheet" href="/demo/tag-helpers/assets/site.urffqt6gbo.css" />
    <link rel="stylesheet" href="/demo/tag-helpers/assets/stellar-admin.8xkpvcneaa.css" />
        <link rel="stylesheet" data-sa-theme /><script>saThemeInit();</script>
    
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s;
        }
    </style>
    

    <script defer src="/demo/tag-helpers/assets/stellar-admin.l1lekyp2hh.js"></script>
</head>
<body>
<script>
    window.addEventListener('load', function () {
        document.body.style.opacity = '1';
    });
</script>
<div class="preview flex w-full justify-center px-10 py-10">
    
    <div class="min-h-[150px]">
    <!-- code begin -->
    <div class="sa-stack sa-stack-align-center sa-stack-gap-md sa-stack-justify-start">
        <div class="sa-group sa-group-align-start sa-group-gap-md sa-group-justify-start">
            <button id="--popover-js-api-button-open" data-slot="button" class="sa-button sa-button-variant-outline sa-button-size-default">
                Open
            </button>
            <button id="--popover-js-api-button-close" data-slot="button" class="sa-button sa-button-variant-outline sa-button-size-default">
                Close
            </button>
            <button id="--popover-js-api-button-toggle" data-slot="button" class="sa-button sa-button-variant-outline sa-button-size-default">
                Toggle
            </button>
        </div>
        <span id="--popover-js-api-avatar" data-slot="avatar" data-size="default" class="sa-avatar"><img alt="" class="sa-avatar-image" data-slot="avatar-image" src="/demo/tag-helpers/assets/avatar-1.jpg"></img></span>
    </div>
    <div id="--popover-js-api" popover="manual" data-slot="popover-content" data-anchor-side="bottom" class="sa-popover-content anchored-bottom">
        <div class="sa-stack sa-stack-align-stretch sa-stack-gap-md sa-stack-justify-start">
            <div class="sa-skeleton h-4 w-[250px]" data-slot="skeleton"></div>
            <div class="sa-skeleton h-4 w-[250px]" data-slot="skeleton"></div>
        </div>
    </div>
    <script>
        const apiPopover = document.getElementById('--popover-js-api');
        const apiPopoverAvatar = document.getElementById('--popover-js-api-avatar');
        const apiPopoverButtonOpen = document.getElementById('--popover-js-api-button-open');
        const apiPopoverButtonClose = document.getElementById('--popover-js-api-button-close');
        const apiTooltipButtonToggle = document.getElementById('--popover-js-api-button-toggle');

        apiPopoverButtonOpen.addEventListener('click', () => {
            apiPopover.showPopover({
                source: apiPopoverAvatar
            });
        });
        apiPopoverButtonClose.addEventListener('click', () => {
            apiPopover.hidePopover();
        });
        apiTooltipButtonToggle.addEventListener('click', () => {
            apiPopover.togglePopover({
                source: apiPopoverAvatar
            });
        });
    </script>
    <!-- code end -->
</div>

</div>



</body>
</html>
