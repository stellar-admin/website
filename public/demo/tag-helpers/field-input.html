<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"/>
    <link rel="stylesheet" href="/demo/tag-helpers/assets/site.yk0a9dj22n.css" />
    <link rel="stylesheet" href="/demo/tag-helpers/assets/stellar-admin.nova.cspk3t8uwa.css" />
    
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s;
        }
    </style>

    <script defer src="/demo/tag-helpers/assets/stellar-admin.r7faauge04.js"></script>
</head>
<body>
<script>
    window.addEventListener('load', function () {
        document.body.style.opacity = '1';
    });
</script>
<div class="preview flex w-full justify-center px-10 py-10">
    
    <div class="w-full max-w-md">
    <!-- code begin -->
    <fieldset data-slot="field-set" class="sa-field-set">
        <div data-slot="field-group" class="sa-field-group group/field-group">
            <div class="sa-field group/field sa-field-orientation-vertical [&amp;&gt;*]:w-full [&amp;&gt;.sr-only]:w-auto" data-orientation="vertical" data-slot="field">
                <label for="email" data-slot="field-label" class="sa-label sa-field-label group/field-label peer/field-label">Email</label>
                <input id="email" type="text" placeholder="e.g. ibn.battuta@rihlah.travel" data-slot="input" class="sa-input"></input>
                <p data-slot="field-description" class="sa-field-description">Your email address</p>
            </div>
            <div class="sa-field group/field sa-field-orientation-vertical [&amp;&gt;*]:w-full [&amp;&gt;.sr-only]:w-auto" data-orientation="vertical" data-slot="field">
                <label for="password" data-slot="field-label" class="sa-label sa-field-label group/field-label peer/field-label">Password</label>
                <input id="password" type="password" placeholder="••••••••" data-slot="input" class="sa-input"></input>
                <p data-slot="field-description" class="sa-field-description">
                    Must be at least 8 characters long.
                </p>
            </div>
        </div>
    </fieldset>
    <!-- code end -->
</div>

</div>



</body>
</html>
