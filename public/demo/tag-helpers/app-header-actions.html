<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"/>
    <link rel="stylesheet" href="/demo/tag-helpers/assets/site.yk0a9dj22n.css" />
    <link rel="stylesheet" href="/demo/tag-helpers/assets/stellar-admin.nova.cspk3t8uwa.css" />
    
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s;
        }
    </style>

    <script defer src="/demo/tag-helpers/assets/stellar-admin.r7faauge04.js"></script>
</head>
<body>
<script>
    window.addEventListener('load', function () {
        document.body.style.opacity = '1';
    });
</script>
<div class="preview flex w-full justify-center px-10 py-10">
    
    <div class="w-full overflow-hidden rounded-lg border">
    <!-- code begin -->
    <header data-slot="app-header" class="sa-app-header">
        <span class="text-sm font-medium">Bookings</span>
        <div data-slot="app-header-actions" class="sa-app-header-actions">
            <button aria-label="Search" data-slot="button" class="sa-button group/button sa-button-variant-ghost sa-button-size-icon-sm">
                <svg fill="none" stroke-linejoin="round" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg" height="24" stroke-width="2" viewBox="0 0 24 24" width="24" stroke="currentColor"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></svg>
            </button>
            <button aria-label="Notifications" data-slot="button" class="sa-button group/button sa-button-variant-ghost sa-button-size-icon-sm">
                <svg fill="none" stroke-linejoin="round" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg" height="24" stroke-width="2" viewBox="0 0 24 24" width="24" stroke="currentColor"><path d="M10.268 21a2 2 0 0 0 3.464 0"></path><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"></path></svg>
            </button>
            <button data-slot="button" class="sa-button group/button sa-button-variant-outline sa-button-size-sm">
                <svg fill="none" stroke-linejoin="round" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg" height="24" stroke-width="2" viewBox="0 0 24 24" width="24" stroke="currentColor"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
                New booking
            </button>
            <span data-slot="avatar" data-size="default" class="sa-avatar group/avatar"><span class="sa-avatar-fallback" data-slot="avatar-fallback">AH</span></span>
        </div>
    </header>
    <!-- code end -->
    <div class="p-4">
        <p class="text-sm text-muted-foreground">
            The actions area is pushed to the end of the app header and spaces its children evenly.
        </p>
    </div>
</div>


</div>



</body>
</html>
