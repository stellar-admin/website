<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (function () {
            var media = window.matchMedia('(prefers-color-scheme: dark)');
            function applyDark() {
                var theme = null;
                try { theme = localStorage.getItem('theme'); } catch (e) { }
                var dark = theme === 'dark' || (theme !== 'light' && media.matches);
                document.documentElement.classList.toggle('dark', dark);
                document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
            }
            window.saThemeInit = function () {
                window.saLoadThemeFonts('default');
            };
            applyDark();
            window.addEventListener('storage', function (e) {
                if (e.key === null || e.key === 'theme') applyDark();
            });
            media.addEventListener('change', applyDark);
        })();
    </script>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <script>window.saThemeFonts = {"default":"Inter:wght@400..700","ledger":"Lexend:wght@300..700","ops":"IBM\u002BPlex\u002BSans:wght@400;500;600;700","soft":"Figtree:wght@400..700"};</script>
    <script src="/demo/tag-helpers/assets/theme-fonts.qm7amh8j3s.js"></script>
    <link rel="stylesheet" href="/demo/tag-helpers/assets/site.nbtoz342i0.css" />
    <link rel="stylesheet" href="/demo/tag-helpers/assets/stellar-admin.a8t3btwq7r.css" />
        <script>saThemeInit();</script>
    
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s;
        }
    </style>
    

    <script defer src="/demo/tag-helpers/assets/stellar-admin.xa30qryeib.js"></script>
</head>
<body>
<script>
    window.addEventListener('load', function () {
        document.body.style.opacity = '1';
    });
</script>
<div class="preview flex w-full justify-center px-10 py-10">
    
    <!--strip
asp-antiforgery="false"
-->
<div class="min-h-[450px]">
    <!-- code begin -->
    <div class="sa-stack sa-stack-align-start sa-stack-gap-md sa-stack-justify-start min-w-md">
        <button commandfor="--dialog-return-form-value-dialog" command="show-modal" data-slot="button" class="sa-button sa-button-variant-outline sa-button-size-default">
            Open Dialog with Form
        </button>
        <label class="text-sm font-bold">Output:</label>
        <div class="font-mono w-full h-40 overflow-y-auto rounded-lg border border-border bg-muted p-3 text-foreground" id="--dialog-return-form-value-output">-</div>
    </div>
    <sel-dialog><dialog id="--dialog-return-form-value-dialog" data-slot="dialog-content" class="sa-dialog-content">
        <form method="dialog" class="grid gap-4" action="/DocsStatic/?name=Dialog/_ReturnFormValue&amp;layout=">
            <div data-slot="dialog-header" class="sa-dialog-header">
                <h2 data-slot="dialog-title" class="sa-dialog-title">Edit traveller</h2>
                <p data-slot="dialog-description" class="sa-dialog-description">Update the traveller's details here. Click save when you're done.
                </p>
            </div>
            <div data-slot="field-group" class="sa-field-group">
                <div class="sa-field sa-field-orientation-vertical" data-orientation="vertical" data-slot="field">
                    <label for="--dialog-return-form-value-name" data-slot="label" class="sa-label">Name</label>
                    <input id="--dialog-return-form-value-name" name="name" value="Ibn Battuta" required data-slot="input" class="sa-input">
                </div>
                <div class="sa-field sa-field-orientation-vertical" data-orientation="vertical" data-slot="field">
                    <label for="--dialog-return-form-value-username" data-slot="label" class="sa-label">Username</label>
                    <input id="--dialog-return-form-value-username" name="username" value="@ibnbattuta" required data-slot="input" class="sa-input">
                </div>
            </div>
            <div data-slot="dialog-footer" class="sa-dialog-footer">
                <button type="button" commandfor="--dialog-return-form-value-dialog" command="close" data-slot="button" class="sa-button sa-button-variant-outline sa-button-size-default">
                    Cancel
                </button>
                <button type="submit" value="confirm" data-slot="button" class="sa-button sa-button-variant-default sa-button-size-default">
                    Save Changes
                </button>
            </div>
        </form>
    </dialog></sel-dialog>
    <script>
        (function() {
            const dialog = document.getElementById("--dialog-return-form-value-dialog");
            const output = document.getElementById("--dialog-return-form-value-output");

            dialog.addEventListener("close", () => {
                const cancelled = dialog.returnValue === "" || dialog.returnValue === "cancel";
                if (cancelled) {
                    output.innerHTML = "Cancelled";
                    return;
                }

                const form = dialog.querySelector("form");
                const data = Object.fromEntries(new FormData(form));
                output.innerHTML = JSON.stringify(data, null, 2);
            });
            dialog.addEventListener("toggle", (e) => {
                // Reset the return value every time the dialog opens to prevent a previous
                // returnValue from being returned when pressing the Esc key
                if (e.newState === "open") {
                    dialog.returnValue = "";
                }
            });
        })();
    </script>
    <!-- code end -->
</div>


</div>



</body>
</html>
