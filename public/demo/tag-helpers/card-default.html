<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"/>
    <link rel="stylesheet" href="/demo/tag-helpers/assets/site.yk0a9dj22n.css" />
    <link rel="stylesheet" href="/demo/tag-helpers/assets/stellar-admin.nova.cspk3t8uwa.css" />
    
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s;
        }
    </style>

    <script defer src="/demo/tag-helpers/assets/stellar-admin.r7faauge04.js"></script>
</head>
<body>
<script>
    window.addEventListener('load', function () {
        document.body.style.opacity = '1';
    });
</script>
<div class="preview flex w-full justify-center px-10 py-10">
    
    <div class="sa-card group/card mx-auto w-full max-w-sm" data-slot="card" data-size="default">
    <div data-slot="card-header" class="sa-card-header group/card-header">
        <div data-slot="card-title" class="sa-card-title">Default Card</div>
        <div data-slot="card-description" class="sa-card-description">
            This card uses the default size variant.
        </div>
    </div>
    <div data-slot="card-content" class="sa-card-content">
        <p>
            The card component supports a size prop that defaults to
            &quot;default&quot; for standard spacing and sizing.
        </p>
    </div>
    <div data-slot="card-footer" class="sa-card-footer">
        <button class="sa-button group/button sa-button-variant-outline sa-button-size-default w-full" data-slot="button">
            Action
        </button>
    </div>
</div>

</div>



</body>
</html>
