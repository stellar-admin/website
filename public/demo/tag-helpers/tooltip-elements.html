<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"/>
    <link rel="stylesheet" href="/demo/tag-helpers/assets/site.yk0a9dj22n.css" />
    <link rel="stylesheet" href="/demo/tag-helpers/assets/stellar-admin.nova.cspk3t8uwa.css" />
    
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s;
        }
    </style>

    <script defer src="/demo/tag-helpers/assets/stellar-admin.r7faauge04.js"></script>
</head>
<body>
<script>
    window.addEventListener('load', function () {
        document.body.style.opacity = '1';
    });
</script>
<div class="preview flex w-full justify-center px-10 py-10">
    
    <div class="sa-stack sa-stack-align-start sa-stack-gap-sm sa-stack-justify-start py-10">
    <!-- code begin -->
    <button interestfor="--tooltip-elements-button" data-slot="button" class="sa-button group/button sa-button-variant-outline sa-button-size-default">
        Button
    </button>
    <a interestfor="--tooltip-elements-linkbutton" href="/DocsStatic" data-slot="button" class="sa-button group/button sa-button-variant-outline sa-button-size-default">
        Link Button
    </a>
    <input interestfor="--tooltip-elements-input" data-slot="input" class="sa-input"></input>
    <textarea interestfor="--tooltip-elements-textarea" data-slot="textarea" class="sa-textarea"></textarea>
    <div interestfor="--tooltip-elements-select" data-slot="native-select-wrapper" data-size="default" class="sa-native-select-wrapper group/native-select"><select interestfor="--tooltip-elements-select" data-slot="native-select" data-size="default" class="sa-native-select">
        <option>Item 1</option>
        <option>Item 2</option>
    </select><svg class="sa-native-select-icon" aria-hidden="true" data-slot="native-select-icon" fill="none" stroke-linejoin="round" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg" height="24" stroke-width="2" viewBox="0 0 24 24" width="24" stroke="currentColor"><path d="m6 9 6 6 6-6"></path></svg></div>
    <span class="sa-input-control-wrapper"><input type="radio" interestfor="--tooltip-elements-radio" data-slot="input" class="sa-radiobutton peer"></input><span class="sa-radiobutton-indicator"><svg class="sa-radiobutton-indicator-icon" fill="none" stroke-linejoin="round" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg" height="24" stroke-width="2" viewBox="0 0 24 24" width="24" stroke="currentColor"><circle cx="12" cy="12" r="10"></circle></svg></span></span>
    <span class="sa-input-control-wrapper"><input type="checkbox" interestfor="--tooltip-elements-checkbox" data-slot="input" class="sa-checkbox peer"></input><span class="sa-checkbox-indicator"><svg class="sa-checkbox-indicator-icon" fill="none" stroke-linejoin="round" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg" height="24" stroke-width="2" viewBox="0 0 24 24" width="24" stroke="currentColor"><path d="M20 6 9 17l-5-5"></path></svg></span></span>
    <div id="--tooltip-elements-button" popover="hint" data-slot="tooltip-content" data-anchor-side="top" class="sa-tooltip-content anchored-top">
        This is a tooltip for the button
    </div>
    <div id="--tooltip-elements-linkbutton" popover="hint" data-slot="tooltip-content" data-anchor-side="top" class="sa-tooltip-content anchored-top">
        This is a tooltip for the link button
    </div>
    <div id="--tooltip-elements-input" popover="hint" data-slot="tooltip-content" data-anchor-side="top" class="sa-tooltip-content anchored-top">
        This is a tooltip for the input
    </div>
    <div id="--tooltip-elements-textarea" popover="hint" data-slot="tooltip-content" data-anchor-side="top" class="sa-tooltip-content anchored-top">
        This is a tooltip for the textarea
    </div>
    <div id="--tooltip-elements-select" popover="hint" data-slot="tooltip-content" data-anchor-side="top" class="sa-tooltip-content anchored-top">
        This is a tooltip for the select
    </div>
    <div id="--tooltip-elements-radio" popover="hint" data-slot="tooltip-content" data-anchor-side="top" class="sa-tooltip-content anchored-top">
        This is a tooltip for the radio button
    </div>
    <div id="--tooltip-elements-checkbox" popover="hint" data-slot="tooltip-content" data-anchor-side="top" class="sa-tooltip-content anchored-top">
        This is a tooltip for the checkbox
    </div>
    <!-- code end -->
</div>

</div>



</body>
</html>
