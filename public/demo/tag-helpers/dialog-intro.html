<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"/>
    <link rel="stylesheet" href="/demo/tag-helpers/assets/site.yk0a9dj22n.css" />
    <link rel="stylesheet" href="/demo/tag-helpers/assets/stellar-admin.nova.cspk3t8uwa.css" />
    
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s;
        }
    </style>

    <script defer src="/demo/tag-helpers/assets/stellar-admin.r7faauge04.js"></script>
</head>
<body>
<script>
    window.addEventListener('load', function () {
        document.body.style.opacity = '1';
    });
</script>
<div class="preview flex w-full justify-center px-10 py-10">
    
    <div class="min-h-[450px]">
    <!-- code begin -->
    <div class="flex justify-center">
        <button commandfor="--dialog-intro" command="show-modal" data-slot="button" class="sa-button group/button sa-button-variant-outline sa-button-size-default">
            Open
        </button>
    </div>
    <sel-dialog><dialog id="--dialog-intro" data-slot="dialog-content" class="sa-dialog-content">
        <div data-slot="dialog-header" class="sa-dialog-header">
            <h2 data-slot="dialog-title" class="sa-dialog-title sa-font-heading font-heading">Edit profile</h2>
            <p data-slot="dialog-description" class="sa-dialog-description">Make changes to your profile here. Click save when you're done.</p>
        </div>
        <div data-slot="field-group" class="sa-field-group group/field-group">
            <div class="sa-field group/field sa-field-orientation-vertical [&amp;&gt;*]:w-full [&amp;&gt;.sr-only]:w-auto" data-orientation="vertical" data-slot="field">
                <label for="--dialog-intro-name" data-slot="label" class="sa-label">Name</label>
                <input id="--dialog-intro-name" name="name" defaultValue="Ibn Battuta" data-slot="input" class="sa-input"></input>
            </div>
            <div class="sa-field group/field sa-field-orientation-vertical [&amp;&gt;*]:w-full [&amp;&gt;.sr-only]:w-auto" data-orientation="vertical" data-slot="field">
                <label for="--dialog-intro-username" data-slot="label" class="sa-label">Username</label>
                <input id="--dialog-intro-username" name="username" defaultValue="@ibnbattuta" data-slot="input" class="sa-input"></input>
            </div>
        </div>
        <div data-slot="dialog-footer" class="sa-dialog-footer">
            <button commandfor="--dialog-intro" command="close" data-slot="button" class="sa-button group/button sa-button-variant-outline sa-button-size-default">
                Cancel
            </button>
            <button commandfor="--dialog-intro" command="close" data-slot="button" class="sa-button group/button sa-button-variant-default sa-button-size-default">
                Save Changes
            </button>
        </div>
    </dialog></sel-dialog>
    <!-- code end -->
</div>


</div>



</body>
</html>
