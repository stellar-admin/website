<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (function () {
            var themes = ['luma', 'lyra', 'maia', 'mira', 'nova', 'rhea', 'sera', 'vega'];
            var media = window.matchMedia('(prefers-color-scheme: dark)');
            function applyDark() {
                var theme = null;
                try { theme = localStorage.getItem('theme'); } catch (e) { }
                var dark = theme === 'dark' || (theme !== 'light' && media.matches);
                document.documentElement.classList.toggle('dark', dark);
                document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
            }
            function themeHref() {
                var theme = null;
                try { theme = localStorage.getItem('demo-theme'); } catch (e) { }
                if (themes.indexOf(theme) < 0) theme = 'nova';
                return '/demo/tag-helpers/assets/stellar-admin.' + theme + '.css';
            }
            window.saThemeInit = function () {
                var link = document.querySelector('link[data-sa-theme]');
                if (link && link.getAttribute('href') !== themeHref()) link.setAttribute('href', themeHref());
            };
            function swapTheme() {
                var links = document.querySelectorAll('link[data-sa-theme]');
                var current = links[links.length - 1];
                if (!current || current.getAttribute('href') === themeHref()) return;
                var next = document.createElement('link');
                next.rel = 'stylesheet';
                next.setAttribute('data-sa-theme', '');
                next.href = themeHref();
                next.addEventListener('load', function () {
                    if (!next.isConnected) return;
                    var all = document.querySelectorAll('link[data-sa-theme]');
                    for (var i = 0; i < all.length && all[i] !== next; i++) all[i].remove();
                });
                current.after(next);
            }
            applyDark();
            window.addEventListener('storage', function (e) {
                if (e.key === null || e.key === 'theme') applyDark();
                if (e.key === null || e.key === 'demo-theme') swapTheme();
            });
            media.addEventListener('change', applyDark);
        })();
    </script>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"/>
    <link rel="stylesheet" href="/demo/tag-helpers/assets/site.0wexyvhui1.css" />
    <link rel="stylesheet" data-sa-theme href="/demo/tag-helpers/assets/stellar-admin.nova.css" /><script>saThemeInit();</script>
    
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s;
        }
    </style>
    

    <script defer src="/demo/tag-helpers/assets/stellar-admin.0frsvhd7es.js"></script>
</head>
<body>

    window.addEventListener('load', function () {
        document.body.style.opacity = '1';

</script>

            <div class="sa-field group/field sa-field-orientation-vertical [&amp;&gt;*]:w-full [&amp;&gt;.sr-only]:w-auto" data-orientation="vertical" data-slot="field">
                <label for="--dialog-intro-username" data-slot="label" class="sa-label">Username</label>
                <input id="--dialog-intro-username" name="username" value="@ibnbattuta" data-slot="input" class="sa-input">
            </div>
        </div>
        <div data-slot="dialog-footer" class="sa-dialog-footer">
            <button commandfor="--dialog-intro" command="close" data-slot="button" class="sa-button group/button sa-button-variant-outline sa-button-size-default">

            </button>
            <button commandfor="--dialog-intro" command="close" data-slot="button" class="sa-button group/button sa-button-variant-default sa-button-size-default">

</div>


</div>

</html>
