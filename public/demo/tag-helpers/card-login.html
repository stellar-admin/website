<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"/>
    <link rel="stylesheet" href="/demo/tag-helpers/assets/site.yk0a9dj22n.css" />
    <link rel="stylesheet" href="/demo/tag-helpers/assets/stellar-admin.nova.cspk3t8uwa.css" />
    
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s;
        }
    </style>

    <script defer src="/demo/tag-helpers/assets/stellar-admin.r7faauge04.js"></script>
</head>
<body>
<script>
    window.addEventListener('load', function () {
        document.body.style.opacity = '1';
    });
</script>
<div class="preview flex w-full justify-center px-10 py-10">
    
    <div class="sa-card group/card mx-auto w-full max-w-sm" data-slot="card" data-size="default">
    <div data-slot="card-header" class="sa-card-header group/card-header">
        <div data-slot="card-title" class="sa-card-title">Login to your account</div>
        <div data-slot="card-description" class="sa-card-description">
            Enter your email below to login to your account
        </div>
    </div>
    <div data-slot="card-content" class="sa-card-content">
        <form>
            <div data-slot="field-group" class="sa-field-group group/field-group">
                <div class="sa-field group/field sa-field-orientation-vertical [&amp;&gt;*]:w-full [&amp;&gt;.sr-only]:w-auto" data-orientation="vertical" data-slot="field">
                    <label for="email" data-slot="field-label" class="sa-label sa-field-label group/field-label peer/field-label">Email</label>
                    <input id="email" type="email" placeholder="m@example.com" required data-slot="input" class="sa-input"></input>
                </div>
                <div class="sa-field group/field sa-field-orientation-vertical [&amp;&gt;*]:w-full [&amp;&gt;.sr-only]:w-auto" data-orientation="vertical" data-slot="field">
                    <div class="flex items-center">
                        <label for="password" data-slot="field-label" class="sa-label sa-field-label group/field-label peer/field-label">Password</label>
                        <a href="#" class="ml-auto inline-block underline-offset-4 hover:underline">
                            Forgot your password?
                        </a>
                    </div>
                    <input id="password" type="password" required data-slot="input" class="sa-input"></input>
                </div>
            </div>
        </form>
    </div>
    <div class="sa-card-footer flex-col gap-2" data-slot="card-footer">
        <button type="submit" class="sa-button group/button sa-button-variant-default sa-button-size-default w-full" data-slot="button">
            Login
        </button>
        <button class="sa-button group/button sa-button-variant-outline sa-button-size-default w-full" data-slot="button">
            Login with Google
        </button>
        <div class="mt-4 text-center">
            Don&apos;t have an account? <a href="#" class="underline underline-offset-4">
                Sign up
            </a>
        </div>
    </div>
</div>

</div>



</body>
</html>
