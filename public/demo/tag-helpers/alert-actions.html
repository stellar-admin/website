<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"/>
    <link rel="stylesheet" href="/demo/tag-helpers/assets/site.yk0a9dj22n.css" />
    <link rel="stylesheet" href="/demo/tag-helpers/assets/stellar-admin.nova.cspk3t8uwa.css" />
    
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s;
        }
    </style>

    <script defer src="/demo/tag-helpers/assets/stellar-admin.r7faauge04.js"></script>
</head>
<body>
<script>
    window.addEventListener('load', function () {
        document.body.style.opacity = '1';
    });
</script>
<div class="preview flex w-full justify-center px-10 py-10">
    
    <div class="mx-auto flex w-full max-w-lg flex-col gap-4">
    <div data-slot="alert" role="alert" class="sa-alert group/alert sa-alert-variant-default">
        <svg fill="none" stroke-linejoin="round" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg" height="24" stroke-width="2" viewBox="0 0 24 24" width="24" stroke="currentColor"><circle cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="8" y2="12"></line><line x1="12" x2="12.01" y1="16" y2="16"></line></svg>
        <div data-slot="alert-title" class="sa-alert-title">The selected emails have been marked as spam.</div>
        <div data-slot="alert-action" class="sa-alert-action">
            <button data-slot="button" class="sa-button group/button sa-button-variant-default sa-button-size-xs">Undo</button>
        </div>
    </div>
    <div data-slot="alert" role="alert" class="sa-alert group/alert sa-alert-variant-default">
        <svg fill="none" stroke-linejoin="round" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg" height="24" stroke-width="2" viewBox="0 0 24 24" width="24" stroke="currentColor"><circle cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="8" y2="12"></line><line x1="12" x2="12.01" y1="16" y2="16"></line></svg>
        <div data-slot="alert-title" class="sa-alert-title">The selected emails have been marked as spam.</div>
        <div data-slot="alert-description" class="sa-alert-description">
            This is a very long alert title that demonstrates how the component
            handles extended text content.
        </div>
        <div data-slot="alert-action" class="sa-alert-action">
            <span data-slot="badge" class="sa-badge group/badge sa-badge-variant-secondary">Badge</span>
        </div>
    </div>
</div>

</div>



</body>
</html>
