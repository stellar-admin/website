<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"/>
    <link rel="stylesheet" href="/demo/tag-helpers/assets/site.yk0a9dj22n.css" />
    <link rel="stylesheet" href="/demo/tag-helpers/assets/stellar-admin.nova.cspk3t8uwa.css" />
    
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s;
        }
    </style>

    <script defer src="/demo/tag-helpers/assets/stellar-admin.r7faauge04.js"></script>
</head>
<body>
<script>
    window.addEventListener('load', function () {
        document.body.style.opacity = '1';
    });
</script>
<div class="preview flex w-full justify-center px-10 py-10">
    
    <div class="w-full max-w-md">
    <!-- code begin -->
    <div data-slot="field-group" class="sa-field-group group/field-group">
        <fieldset data-slot="field-set" class="sa-field-set">
            <label data-slot="field-label" class="sa-label sa-field-label group/field-label peer/field-label">Responses</label>
            <p data-slot="field-description" class="sa-field-description">
                Get notified when ChatGPT responds to requests that take time, like
                research or image generation.
            </p>
            <div data-slot="checkbox-group" class="sa-field-group group/field-group">
                <div class="sa-field group/field sa-field-orientation-horizontal" data-orientation="horizontal" data-slot="field">
                    <span class="sa-input-control-wrapper"><input type="checkbox" id="push" checked disabled data-slot="input" class="sa-checkbox peer"></input><span class="sa-checkbox-indicator"><svg class="sa-checkbox-indicator-icon" fill="none" stroke-linejoin="round" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg" height="24" stroke-width="2" viewBox="0 0 24 24" width="24" stroke="currentColor"><path d="M20 6 9 17l-5-5"></path></svg></span></span>
                    <label for="push" class="sa-label sa-field-label group/field-label peer/field-label font-normal" data-slot="field-label">
                        Push notifications
                    </label>
                </div>
            </div>
        </fieldset>
        <div data-slot="field-separator" data-content="false" class="sa-field-separator"><div class="sa-separator sa-separator-horizontal sa-field-separator-line" role="separator" aria-orientation="horizontal" data-slot="separator" data-orientation="horizontal"></div></div>
        <fieldset data-slot="field-set" class="sa-field-set">
            <label data-slot="field-label" class="sa-label sa-field-label group/field-label peer/field-label">Tasks</label>
            <p data-slot="field-description" class="sa-field-description">
                Get notified when tasks you&apos;ve created have updates. <a href="#">Manage tasks</a>
            </p>
            <div data-slot="checkbox-group" class="sa-field-group group/field-group">
                <div class="sa-field group/field sa-field-orientation-horizontal" data-orientation="horizontal" data-slot="field">
                    <span class="sa-input-control-wrapper"><input type="checkbox" id="push-tasks" data-slot="input" class="sa-checkbox peer"></input><span class="sa-checkbox-indicator"><svg class="sa-checkbox-indicator-icon" fill="none" stroke-linejoin="round" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg" height="24" stroke-width="2" viewBox="0 0 24 24" width="24" stroke="currentColor"><path d="M20 6 9 17l-5-5"></path></svg></span></span>
                    <label for="push-tasks" class="sa-label sa-field-label group/field-label peer/field-label font-normal" data-slot="field-label">
                        Push notifications
                    </label>
                </div>
                <div class="sa-field group/field sa-field-orientation-horizontal" data-orientation="horizontal" data-slot="field">
                    <span class="sa-input-control-wrapper"><input type="checkbox" id="email-tasks" data-slot="input" class="sa-checkbox peer"></input><span class="sa-checkbox-indicator"><svg class="sa-checkbox-indicator-icon" fill="none" stroke-linejoin="round" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg" height="24" stroke-width="2" viewBox="0 0 24 24" width="24" stroke="currentColor"><path d="M20 6 9 17l-5-5"></path></svg></span></span>
                    <label for="email-tasks" class="sa-label sa-field-label group/field-label peer/field-label font-normal" data-slot="field-label">
                        Email notifications
                    </label>
                </div>
            </div>
        </fieldset>
    </div>
    <!-- code end -->
</div>

</div>



</body>
</html>
