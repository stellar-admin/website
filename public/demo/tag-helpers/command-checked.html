<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (function () {
            var themes = ['aurora', 'concourse', 'ice', 'ledger', 'meridian', 'observatory', 'parallax', 'shadcn.luma', 'shadcn.lyra', 'shadcn.maia', 'shadcn.mira', 'shadcn.nova', 'shadcn.rhea', 'shadcn.sera', 'shadcn.vega'];
            var media = window.matchMedia('(prefers-color-scheme: dark)');
            function applyDark() {
                var theme = null;
                try { theme = localStorage.getItem('theme'); } catch (e) { }
                var dark = theme === 'dark' || (theme !== 'light' && media.matches);
                document.documentElement.classList.toggle('dark', dark);
                document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
            }
            function selectedTheme() {
                var theme = null;
                try { theme = localStorage.getItem('demo-theme'); } catch (e) { }
                if (themes.indexOf(theme) < 0) theme = 'observatory';
                return theme;
            }
            function themeHref() {
                return '/demo/tag-helpers/assets/stellar-admin.' + selectedTheme() + '.css';
            }
            window.saThemeInit = function () {
                window.saLoadThemeFonts(selectedTheme());
                var link = document.querySelector('link[data-sa-theme]');
                if (link && link.getAttribute('href') !== themeHref()) link.setAttribute('href', themeHref());
            };
            function swapTheme() {
                window.saLoadThemeFonts(selectedTheme());
                var links = document.querySelectorAll('link[data-sa-theme]');
                var current = links[links.length - 1];
                if (!current || current.getAttribute('href') === themeHref()) return;
                var next = document.createElement('link');
                next.rel = 'stylesheet';
                next.setAttribute('data-sa-theme', '');
                next.href = themeHref();
                next.addEventListener('load', function () {
                    if (!next.isConnected) return;
                    var all = document.querySelectorAll('link[data-sa-theme]');
                    for (var i = 0; i < all.length && all[i] !== next; i++) all[i].remove();
                });
                current.after(next);
            }
            applyDark();
            window.addEventListener('storage', function (e) {
                if (e.key === null || e.key === 'theme') applyDark();
                if (e.key === null || e.key === 'demo-theme') swapTheme();
            });
            media.addEventListener('change', applyDark);
        })();
    </script>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <script src="/demo/tag-helpers/assets/theme-fonts.vqsfb4uqta.js"></script>
    <link rel="stylesheet" href="/demo/tag-helpers/assets/site.i29hikxk5w.css" />
    <link rel="stylesheet" data-sa-theme href="/demo/tag-helpers/assets/stellar-admin.observatory.css" /><script>saThemeInit();</script>
    
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s;
        }
    </style>
    

    <script defer src="/demo/tag-helpers/assets/stellar-admin.rz2ayfifdl.js"></script>
</head>
<body>

    window.addEventListener('load', function () {
        document.body.style.opacity = '1';

</script>

                    <span>South African rand</span>
                    <span class="text-muted-foreground">ZAR</span>
                <svg class="sa-command-item-indicator" viewBox="0 0 24 24" height="24" width="24" stroke-linejoin="round" stroke-linecap="round" stroke-width="2" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor"><path d="M20 6 9 17l-5-5"></path></svg></div>
            </div></div>
        </div>
    </sel-command>
    <p class="text-muted-foreground text-sm" id="--currency-output">Prices are shown in EUR.</p>
    <script>
        (() => {
            const command = document.getElementById('--currency-command');
            const output = document.getElementById('--currency-output');

            // "itemselect" bubbles from the chosen item; move the check mark to it.
            command.addEventListener('itemselect', (event) => {
                command.querySelectorAll('[data-checked]').forEach((item) => item.removeAttribute('data-checked'));
                event.target.setAttribute('data-checked', 'true');
                output.textContent = `Prices are shown in ${event.detail.value}.`;
            });
        })();
    </script>
    <!-- code end -->
</div>


</div>
