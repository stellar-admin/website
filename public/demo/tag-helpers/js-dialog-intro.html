<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="/demo/tag-helpers/assets/site.paa1s24567.css" />

            opacity: 0;
            transition: opacity 0.5s;

<body>
<script>
    window.addEventListener('load', function () {
        document.body.style.opacity = '1';
    });
</script>
<div class="preview flex w-full justify-center px-10 py-10">

<div class="min-h-[450px]">
    <!-- code begin -->
    <div class="flex flex-col items-start gap-y-4 justify-start min-w-md">

            Open Dialog
        </button>
        <label class="text-sm font-bold">Result:</label>
        <div class="font-mono w-full h-40 overflow-y-auto bg-gray-50" id="--js-dialog-intro-result">-</div>
    </div>
    <del-dialog><dialog id="--js-dialog-intro-dialog" data-slot="dialog-content" class="bg-popover text-popover-foreground data-open:animate-in data-closed:animate-out data-closed:fade-out-0 data-open:fade-in-0 data-closed:zoom-out-95 data-open:zoom-in-95 ring-foreground/10 data-open:grid max-w-[calc(100%-2rem)] gap-4 rounded-xl p-4 text-sm ring-1 duration-100 sm:max-w-sm fixed inset-0 m-auto outline-none backdrop:supports-backdrop-filter:backdrop-blur-xs">
        <div data-slot="dialog-header" class="gap-2 flex flex-col">
            <h2 data-slot="dialog-title" class="text-base leading-none font-medium font-heading">Are you absolutely sure?</h2>
            <p data-slot="dialog-description" class="text-muted-foreground *:[a]:hover:text-foreground text-sm *:[a]:underline *:[a]:underline-offset-3">
                This action cannot be undone. This will permanently delete your account from our servers.
            </p>
        </div>
        <form method="dialog" action="/DocsStatic/?name=Js/Dialog/_Intro&amp;layout=">
            <div data-slot="dialog-footer" class="bg-muted/50 -mx-4 -mb-4 rounded-b-xl border-t p-4 flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
                <button type="submit" value="cancel" data-slot="button" class="focus-visible:border-ring focus-visible:ring-ring/50 aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive dark:aria-invalid:border-destructive/50 rounded-lg border bg-clip-padding text-sm font-medium focus-visible:ring-3 active:not-aria-[haspopup]:translate-y-px [&amp;_svg:not([class*=&#x27;size-&#x27;])]:size-4 [&amp;.input-validation-error]:ring-destructive/20 dark:[&amp;.input-validation-error]:ring-destructive/40 [&amp;.input-validation-error]:border-destructive dark:[&amp;.input-validation-error]:border-destructive/50 inline-flex items-center justify-center whitespace-nowrap transition-all disabled:pointer-events-none disabled:opacity-50 [&amp;_svg]:pointer-events-none shrink-0 [&amp;_svg]:shrink-0 outline-none group/button select-none border-border bg-background hover:bg-muted hover:text-foreground dark:bg-input/30 dark:border-input dark:hover:bg-input/50 aria-expanded:bg-muted aria-expanded:text-foreground h-8 gap-1.5 px-2.5 has-data-[icon=inline-end]:pr-2 has-data-[icon=inline-start]:pl-2">
                    Cancel
                </button>
                <button type="submit" value="confirm" autofocus data-slot="button" class="focus-visible:border-ring focus-visible:ring-ring/50 aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive dark:aria-invalid:border-destructive/50 rounded-lg border border-transparent bg-clip-padding text-sm font-medium focus-visible:ring-3 active:not-aria-[haspopup]:translate-y-px [&amp;_svg:not([class*=&#x27;size-&#x27;])]:size-4 [&amp;.input-validation-error]:ring-destructive/20 dark:[&amp;.input-validation-error]:ring-destructive/40 [&amp;.input-validation-error]:border-destructive dark:[&amp;.input-validation-error]:border-destructive/50 inline-flex items-center justify-center whitespace-nowrap transition-all disabled:pointer-events-none disabled:opacity-50 [&amp;_svg]:pointer-events-none shrink-0 [&amp;_svg]:shrink-0 outline-none group/button select-none bg-primary text-primary-foreground hover:bg-primary/80 h-8 gap-1.5 px-2.5 has-data-[icon=inline-end]:pr-2 has-data-[icon=inline-start]:pl-2">
                    Continue
                </button>
            </div>
        </form>
    </dialog></del-dialog>
    <script type="module">
        (function () {
            const dialog = window.duneui.dialog(document.getElementById("--js-dialog-intro-dialog"));
            const triggerButton = document.getElementById("--js-dialog-intro-button");
            const resultDisplay = document.getElementById("--js-dialog-intro-result");

            triggerButton.addEventListener("click", async (event) => {
                const result = await dialog.showAsync();
                resultDisplay.innerHTML = JSON.stringify(result, null, 4);
            });
        })();
    </script>
    <!-- code end -->
</div>

</div>



</body>
</html>
