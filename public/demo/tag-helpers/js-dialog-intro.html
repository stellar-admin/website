<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"/>
    <link rel="stylesheet" href="/demo/tag-helpers/assets/site.yk0a9dj22n.css" />
    <link rel="stylesheet" href="/demo/tag-helpers/assets/stellar-admin.nova.cspk3t8uwa.css" />
    
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s;
        }
    </style>

    <script defer src="/demo/tag-helpers/assets/stellar-admin.r7faauge04.js"></script>
</head>
<body>
<script>
    window.addEventListener('load', function () {
        document.body.style.opacity = '1';
    });
</script>
<div class="preview flex w-full justify-center px-10 py-10">
    
    <!--strip
asp-antiforgery="false"
-->
<div class="min-h-[450px]">
    <!-- code begin -->
    <div class="sa-stack sa-stack-align-start sa-stack-gap-md sa-stack-justify-start min-w-md">
        <button id="--js-dialog-intro-button" data-slot="button" class="sa-button group/button sa-button-variant-outline sa-button-size-default">
            Open Dialog
        </button>
        <label class="text-sm font-bold">Result:</label>
        <div class="font-mono w-full h-40 overflow-y-auto bg-gray-50" id="--js-dialog-intro-result">-</div>
    </div>
    <sel-dialog><dialog id="--js-dialog-intro-dialog" data-slot="dialog-content" class="sa-dialog-content">
        <div data-slot="dialog-header" class="sa-dialog-header">
            <h2 data-slot="dialog-title" class="sa-dialog-title sa-font-heading font-heading">Are you absolutely sure?</h2>
            <p data-slot="dialog-description" class="sa-dialog-description">
                This action cannot be undone. This will permanently delete your account from our servers.
            </p>
        </div>
        <form method="dialog" action="/DocsStatic/?name=Js/Dialog/_Intro&amp;layout=">
            <div data-slot="dialog-footer" class="sa-dialog-footer">
                <button type="submit" value="cancel" data-slot="button" class="sa-button group/button sa-button-variant-outline sa-button-size-default">
                    Cancel
                </button>
                <button type="submit" value="confirm" autofocus data-slot="button" class="sa-button group/button sa-button-variant-default sa-button-size-default">
                    Continue
                </button>
            </div>
        </form>
    </dialog></sel-dialog>
    <script type="module">
        (function () {
            const dialog = window.stellarAdmin.dialog(document.getElementById("--js-dialog-intro-dialog"));
            const triggerButton = document.getElementById("--js-dialog-intro-button");
            const resultDisplay = document.getElementById("--js-dialog-intro-result");

            triggerButton.addEventListener("click", async (event) => {
                const result = await dialog.showAsync();
                resultDisplay.innerHTML = JSON.stringify(result, null, 4);
            });
        })();
    </script>
    <!-- code end -->
</div>

</div>



</body>
</html>
