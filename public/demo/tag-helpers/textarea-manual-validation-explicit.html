<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"/>
    <link rel="stylesheet" href="/demo/tag-helpers/assets/site.yk0a9dj22n.css" />
    <link rel="stylesheet" href="/demo/tag-helpers/assets/stellar-admin.nova.cspk3t8uwa.css" />
    
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s;
        }
    </style>

    <script defer src="/demo/tag-helpers/assets/stellar-admin.r7faauge04.js"></script>
</head>
<body>
<script>
    window.addEventListener('load', function () {
        document.body.style.opacity = '1';
    });
</script>
<div class="preview flex w-full justify-center px-10 py-10">
    
    <div class="sa-field group/field sa-field-orientation-vertical [&amp;&gt;*]:w-full [&amp;&gt;.sr-only]:w-auto" data-orientation="vertical" data-slot="field">
    <label data-slot="field-label" class="sa-label sa-field-label group/field-label peer/field-label">Describe your experience</label>
    <textarea aria-invalid="true" placeholder="The view from the balcony was breathtaking, but the breakfast service was a bit slow..." data-slot="textarea" class="sa-textarea"></textarea>
    <div class="sa-field-error field-validation-error" role="alert" data-slot="field-error">
        Please leave a review for other travelers
    </div>
    <p data-slot="field-description" class="sa-field-description">
        Your feedback helps other travelers make better choices. Be as descriptive as possible!
    </p>
</div>

</div>



</body>
</html>
